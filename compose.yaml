# Local-development counterpart to docker/compose.action.yaml, which it
# extends so the two cannot drift: this one only adds building the proxy image
# from source. CI's test_sandbox/test_sandbox_* jobs build through it (via
# .github/actions/prepare-local-proxy, relying on Compose's default-filename
# discovery).
services:
  proxy:
    extends:
      file: docker/compose.action.yaml
      service: proxy
    # Dropped so the build takes Compose's own name, which carries the project
    # and so differs between checkouts.
    image: !reset null
    build:
      context: .
      dockerfile: docker/${PROXY_ENGINE:-inspect}/Dockerfile
