name: "Buildcage for run steps"
description: "Restrict outbound network access in a workflow run step to an allowlist of domains"
branding:
  icon: terminal
  color: blue

inputs:
  run:
    description: "Command(s) to run inside the isolated sandbox (multi-line supported, like a workflow run: step). Runs under bash -e; start with a #! line to use another interpreter."
    required: true
  config_file:
    description: "YAML file, relative to the workspace, setting any input but run and the deprecated writable. An input the workflow sets wins; rule lists and write_through are combined. See docs/reference.md#config-file."
    required: false
    default: ""
  proxy_mode:
    description: "Traffic policy: audit records every destination the command reaches and blocks nothing (allowed_*_rules have no effect in this mode), or restrict (default) allows only what the rules match and blocks the rest. Run audit once, take the allowlist from its report, then switch to restrict."
    required: false
  proxy_engine:
    description: "Network enforcement engine: inspect (default, terminates TLS to enforce on method and URL) or universal (network-level proxy, needs no CA trust)"
    required: false
  allowed_https_rules:
    description: "HTTPS allow rules (wildcard or ~regex), separated by whitespace. Port required. e.g., '*.example.com:443 ~^custom\\.pattern:443$'"
    required: false
    default: ""
  allowed_http_rules:
    description: "HTTP allow rules (wildcard or ~regex), separated by whitespace. Port required. e.g., 'example.com:80'"
    required: false
    default: ""
  allowed_ip_rules:
    description: "IP address allow rules (address, CIDR block, wildcard or ~regex), separated by whitespace. Port required. e.g., '192.168.1.1:443 10.0.0.1:8080'"
    required: false
    default: ""
  allowed_url_rules:
    description: "URL allow rules, one per line, as '<methods> <url>'. Methods are separated by | or , and * means any. Requires proxy_engine: inspect. e.g., 'GET|HEAD https://registry.npmjs.org/**'"
    required: false
    default: ""
  allowed_tls_rules:
    description: "TLS destinations passed through undecrypted, judged on SNI alone, separated by whitespace. Port required. Requires proxy_engine: inspect. e.g., 'db.example.com:5432'"
    required: false
    default: ""
  aws_key_check:
    description: "Experimental. Refuse AWS API requests signed with any key but the step's own AWS_ACCESS_KEY_ID. Default false. Requires proxy_engine: inspect and AWS_ACCESS_KEY_ID in the step's environment. See docs/reference.md#aws-access-key-check."
    required: false
  allowed_aws_role_accounts:
    description: "Experimental. AWS account IDs whose roles the step may assume, whose keys then pass aws_key_check too, separated by commas or whitespace. Requires aws_key_check: true. See docs/reference.md#aws-access-key-check."
    required: false
    default: ""
  upload_traffic_artifact:
    description: "Upload the observed traffic as a JSON artifact. It keeps every URL verbatim, so treat it as sensitive. Default false. See docs/reference.md#traffic-artifact."
    required: false
  traffic_artifact_retention_days:
    description: "How long to keep that artifact, in days. Empty uses the repository's own default, and a value above the repository maximum is lowered to it, with a warning."
    required: false
    default: ""
  fail_on_blocked:
    description: "Fail the step if any connection was blocked (restrict mode only). Default true."
    required: false
  fail_on_ca_residue:
    description: "proxy_engine: inspect only. Whether a command that leaves a copy of the proxy CA in the NSS database Chromium reads fails the step (true, default) or only warns (false). With false, the copy is written back. See docs/reference.md#chromium."
    required: false
  known_blocked_rules:
    description: "Traffic expected to be blocked, one rule per line: a host rule (wildcard or ~regex) or, under proxy_engine: inspect, a URL rule. Blocked traffic matching one doesn't fail the step even when fail_on_blocked is true. See docs/reference.md#blocked-rules-known_blocked_rules."
    required: false
    default: ""
  write_through:
    description: "Paths whose writes reach the real host filesystem, one per line: made writable under persistent, exempt from the discard under ephemeral. Relative paths resolve against $GITHUB_WORKSPACE. See docs/reference.md#write_through-paths."
    required: false
    default: ""
  writable:
    description: "Deprecated: the former name of write_through. Still works; set write_through instead."
    required: false
    default: ""
  filesystem_mode:
    description: "persistent (default) keeps writes to $HOME/$RUNNER_TEMP/$GITHUB_WORKSPACE/tmp on the host after the step ends. ephemeral discards them instead (via an overlay), except for paths listed in write_through. Use this to stop a step from planting files (e.g. ~/.bashrc, ~/.npmrc) that a later, non-isolated step would pick up."
    required: false
  filesystem_audit:
    description: "Experimental. record logs the file accesses of the isolated step; off (default) does not. Needs a cgroup v2 host. See docs/reference.md#filesystem-audit."
    required: false
  filesystem_audit_retention_days:
    description: "How long to keep the filesystem audit artifact, in days. Empty uses the repository's own default."
    required: false
    default: ""
  label:
    description: "Label appended to this step's Job Summary heading, e.g. 'npm install'. Useful to tell steps apart when `run` is used more than once in the same job"
    required: false
    default: ""

outputs:
  traffic_artifact_name:
    description: "Name of the uploaded traffic artifact, when upload_traffic_artifact produced one. Empty otherwise, so a later step can tell an upload apart from none having been requested."
  filesystem_audit_artifact_name:
    description: "Name of the uploaded filesystem audit artifact, when filesystem_audit: record recorded something. Empty otherwise."

runs:
  using: node24
  main: dist/main.cjs
  post: dist/post.cjs
