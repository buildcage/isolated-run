name: "Buildcage for run steps"
description: "Restrict outbound network access in a workflow run step to an allowlist of domains"
branding:
  icon: terminal
  color: blue

inputs:
  run:
    description: "Command(s) to run inside the isolated sandbox (multi-line supported, like a workflow run: step). Runs under bash -e; start with a #! line to use another interpreter."
    required: true
  proxy_mode:
    description: "Traffic policy: audit records every destination the command reaches and blocks nothing (allowed_*_rules have no effect in this mode), or restrict (default) allows only what the rules match and blocks the rest. Run audit once, take the allowlist from its report, then switch to restrict."
    required: false
    default: "restrict"
  proxy_engine:
    description: "Network enforcement engine: inspect (default, terminates TLS to enforce on method and URL) or universal (network-level proxy, needs no CA trust)"
    required: false
    default: "inspect"
  allowed_https_rules:
    description: "HTTPS allow rules (wildcard or ~regex), separated by whitespace. Port required. e.g., '*.example.com:443 ~^custom\\.pattern:443$'"
    required: false
    default: ""
  allowed_http_rules:
    description: "HTTP allow rules (wildcard or ~regex), separated by whitespace. Port required. e.g., 'example.com:80'"
    required: false
    default: ""
  allowed_ip_rules:
    description: "IP address allow rules (wildcard or ~regex), separated by whitespace. Port required. e.g., '192.168.1.1:443 10.0.0.1:8080'"
    required: false
    default: ""
  allowed_url_rules:
    description: "URL allow rules, one per line, as '<methods> <url>'. Methods are separated by | or , and * means any. Requires proxy_engine: inspect. e.g., 'GET|HEAD https://registry.npmjs.org/**'"
    required: false
    default: ""
  allowed_tls_rules:
    description: "TLS destinations passed through undecrypted, judged on SNI alone, separated by whitespace. Port required. Requires proxy_engine: inspect. e.g., 'db.example.com:5432'"
    required: false
    default: ""
  upload_traffic_artifact:
    description: "Upload the observed traffic as a JSON artifact, fetchable afterwards by whoever turns out to want it: a later job in the same run via actions/download-artifact, or anyone else via the API, subject to the retention period below. It keeps every URL verbatim, including any credential a build embedded in a query or a path, so treat it as sensitive. Both engines produce one; under universal it omits the method, URL and status that only inspect sees."
    required: false
    default: "false"
  traffic_artifact_retention_days:
    description: "How long to keep that artifact, in days. Empty uses the repository's own default, and a value above the repository maximum is refused by GitHub."
    required: false
    default: ""
  fail_on_blocked:
    description: "Fail the step if any connection was blocked (restrict mode only)"
    required: false
    default: "true"
  known_blocked_rules:
    description: "Domains expected to be blocked intentionally (wildcard or ~regex), separated by whitespace. A rule that names no port matches any port, a refused name having none. Blocked connections matching these rules don't fail the step even when fail_on_blocked is true; only unmatched (unexpected) blocked connections do. e.g., 'known-noisy.example.com:443'"
    required: false
    default: ""
  write_through:
    description: "Paths whose writes reach the real host filesystem (newline-separated), in either filesystem mode: on top of the always-writable $GITHUB_WORKSPACE/$HOME/tmp/$RUNNER_TEMP under persistent, and exempt from the discard under ephemeral. Relative paths resolve against $GITHUB_WORKSPACE; $HOME, $GITHUB_WORKSPACE, $RUNNER_TEMP, $GITHUB_OUTPUT, $GITHUB_ENV, $GITHUB_PATH, $GITHUB_STEP_SUMMARY and a leading ~/ are supported. A missing path is created (via sudo) with the same owner/permissions as its nearest existing parent directory, and removed again at the end of the step if the command left it empty. Use '/' to drop the read-only restriction entirely (persistent only). A few paths the sandbox mounts itself (/etc/resolv.conf, /etc/ssl/certs/ca-certificates.crt, /etc/buildcage-ca.pem, and filesystems like /proc and /dev) are reserved and rejected here; naming a directory that contains them is fine. The sandbox covers the host's /run with an empty tmpfs to keep host service sockets out of reach; name a path under /run (or /run itself) here to re-expose it, e.g. a service socket a later step needs. Re-exposing a host daemon's socket reopens an outbound path through that daemon, and re-exposing all of /run leaves the outbound restriction nearly pointless, so do it deliberately."
    required: false
    default: ""
  writable:
    description: "Deprecated: the former name of write_through. Still works; set write_through instead."
    required: false
    default: ""
  filesystem_mode:
    description: "persistent (default) keeps writes to $HOME/$RUNNER_TEMP/$GITHUB_WORKSPACE/tmp on the host after the step ends. ephemeral discards them instead (via an overlay), except for paths listed in write_through. Use this to stop a step from planting files (e.g. GITHUB_ENV, ~/.bashrc, ~/.npmrc) that a later, non-isolated step would pick up."
    required: false
    default: "persistent"
  label:
    description: "Label appended to this step's Job Summary heading, e.g. 'npm install'. Useful to tell steps apart when `run` is used more than once in the same job"
    required: false
    default: ""

outputs:
  traffic_artifact_name:
    description: "Name of the uploaded traffic artifact, when upload_traffic_artifact produced one. Empty otherwise, so a later step can tell an upload apart from none having been requested."

runs:
  using: node24
  main: dist/main.cjs
  post: dist/post.cjs
