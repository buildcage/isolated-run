# Mac-friendly dev-loop overlay for the run action (see ../dev/Dockerfile
# for why this exists and how it differs from production / CI's test_sandbox).
#
# Usage: make setup_sandbox_dev / make test_sandbox_dev
#
# Always combined with ../compose.yaml via `-f compose.yaml -f
# docker/compose.sandbox-dev.yaml`, and Compose resolves every file's
# relative paths against the *first* -f file's directory (the repo root),
# not against this file's own directory — so paths below are written
# root-relative, not docker/-relative. Verified with `docker compose -f
# compose.yaml -f docker/compose.sandbox-dev.yaml config`.
services:
  sandbox-dev-runner:
    container_name: buildcage-sandbox-dev-runner
    build:
      context: .
      dockerfile: dev/Dockerfile
    pid: host
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    # runc needs to create/manage a cgroup for the sandboxed process, which
    # needs a writable /sys/fs/cgroup -- read-only by default in a
    # non-privileged container, same reasoning as the "proxy" service in
    # ../compose.yaml. Not needed on the real GitHub Actions runner host
    # this dev loop stands in for (root already has full cgroup access
    # there without this).
    cgroup: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ./scripts/run-isolated.sh:/usr/local/bin/run-isolated.sh:ro
      - ./scripts/extra-masked-proc-paths.json:/etc/buildcage/extra-masked-proc-paths.json:ro
      - ./dev/smoke-test.sh:/usr/local/bin/smoke-test.sh:ro
      - ./dev/build-test-bundle.sh:/usr/local/bin/build-test-bundle.sh:ro
    depends_on:
      proxy:
        condition: service_started
    restart: unless-stopped
