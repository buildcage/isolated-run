# Layered on compose.action.yaml through BUILDCAGE_TEST_COMPOSE_OVERLAY (see
# src/core/lib/provenance/local-image-override.ts) by this repo's own
# inspect-engine integration tests, which reach it only in a build made with
# BUILDCAGE_BUILD_TEST_HOOKS=1. Adds what a published action has no reason to
# know about: a second network joining the fixture origins started by
# ../compose.test-inspect.yaml, and trust for their self-signed certificate.
# Paths resolve against this directory, the first compose file's.
services:
  proxy:
    environment:
      - TEST_NET_ADDR=10.200.0.2/24
      - TEST_NET_SUBNET=${TEST_NET_SUBNET:-10.210.0.0/24}
      # What the action computed, plus a fixture address nothing answers on so
      # the blocked-name scenario has a deterministic target.
      - HOST_ADDRESSES=${HOST_ADDRESSES:-} 10.200.0.199
      # Honoured only by an image built with BUILDCAGE_TEST_HOOKS=1 (see
      # docker/inspect/Dockerfile's /opt/buildcage/.test-hooks marker).
      - BUILDCAGE_EXTRA_CA_FILE=/test-fixtures/test-server-cert.pem
    volumes:
      - ../test/test-net-addr/attach.sh:/test-hooks/attach-test-net-addr.sh:ro
      # An absolute host path, set by the test script itself.
      - ${BUILDCAGE_TEST_CERT_PATH:?BUILDCAGE_TEST_CERT_PATH must be an absolute path to test-server-inspect/cert.pem}:/test-fixtures/test-server-cert.pem:ro
    # Wrapped here rather than in the image: the proxy is the product image
    # and carries no test-only setup.
    entrypoint: ["/test-hooks/attach-test-net-addr.sh", "/init"]
    # Docker's embedded DNS forwards here, so HAProxy reaches the fixture resolver
    # through resolv.conf, as it reaches the runner's DNS in a job.
    dns: [10.200.0.53]
    networks:
      default:
      test-net:

networks:
  test-net:
    # Must match ../compose.test-*.yaml's own name, suffix included.
    name: buildcage-test-inspect-net${BUILDCAGE_WORKTREE_SUFFIX:-}
    external: true
