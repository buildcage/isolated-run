# Test-only counterpart to compose.action.yaml, used only via
# BUILDCAGE_TEST_COMPOSE_FILE (see
# src/core/lib/provenance/local-image-override.ts) by this repo's own
# inspect-engine integration tests. Adds the one thing a published action has
# no reason to know about: a second network joining the fixture origins
# started by ../compose.test-inspect.yaml, and trust for their self-signed
# certificate.
#
# BUILDCAGE_TEST_COMPOSE_FILE only takes effect at all when
# BUILDCAGE_BUILD_TEST_HOOKS=1 was set at build time (see
# LOCAL_IMAGE_OVERRIDE_ENABLED in src/main.ts) -- unreachable, and therefore
# irrelevant, in a published action's dist/main.cjs.
services:
  proxy:
    container_name: ${PROXY_CONTAINER_NAME:-buildcage-proxy}
    image: ${BUILDCAGE_PROXY_IMAGE_REF:-placeholder}
    cap_add:
      - NET_ADMIN
    environment:
      - PROXY_MODE=${PROXY_MODE:-restrict}
      - ALLOWED_HTTPS_RULES=${ALLOWED_HTTPS_RULES:-}
      - ALLOWED_HTTP_RULES=${ALLOWED_HTTP_RULES:-}
      - ALLOWED_IP_RULES=${ALLOWED_IP_RULES:-}
      - ALLOWED_URL_RULES=${ALLOWED_URL_RULES:-}
      - ALLOW_TLS_RULES=${ALLOW_TLS_RULES:-}
      - EXTERNAL_RESOLVER=${EXTERNAL_RESOLVER:-}
      # Test-only: init-inspect-cfg only honours this in an image built with
      # BUILDCAGE_TEST_HOOKS=1 (see docker/inspect/Dockerfile's
      # /opt/buildcage/.test-hooks marker) -- a fixed in-container path,
      # regardless of where the host-side cert actually lives.
      - BUILDCAGE_EXTRA_CA_FILE=/test-fixtures/test-server-cert.pem
    volumes:
      # BUILDCAGE_TEST_CERT_PATH: an absolute host path, set by the test
      # script itself -- a relative path here would resolve against this
      # file's own directory (docker/), not the repo root.
      - ${BUILDCAGE_TEST_CERT_PATH:?BUILDCAGE_TEST_CERT_PATH must be an absolute path to test-server-inspect/cert.pem}:/test-fixtures/test-server-cert.pem:ro
    networks:
      default:
      test-net:
    restart: unless-stopped

networks:
  test-net:
    name: buildcage-test-inspect-net
    external: true
