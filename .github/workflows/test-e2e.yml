name: Test / E2E
run-name: Test / E2E (${{ github.ref_name }})

on:
  workflow_dispatch:

  # epic/ branches gather a large change before it lands on main.
  pull_request:
    branches:
      - main
      - "epic/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    name: changes
    if: github.event_name == 'pull_request'
    outputs:
      test_sandbox: ${{ steps.filter.outputs.test_sandbox }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            # Covers everything the engine Dockerfiles COPY.
            test_sandbox:
              - 'src/core/**'
              - 'docker/**'
              - 'compose.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'rolldown.config.js'
              - 'rolldown.scripts.config.js'
              - 'tsconfig.json'
              - '.dockerignore'
              - 'licenses/**'
              - 'LICENSE'
              - '.github/actions/setup-vp/**'
              - '.github/actions/prepare-local-proxy/**'
              - '.github/workflows/test-e2e.yml'
              - 'action.yml'
              - 'src/**'
              - 'scripts/**'
              - 'test/**'

  # Exercises the real action end-to-end (uses: ./) on the actual runner
  # host; none of this can be validated inside a nested container (see dev/
  # and docs/development.md).
  #
  # Cases that need the same image share a job: runners, not job length, are
  # what a run waits on. run-isolated.sh's own mechanics
  # (privilege drop, filesystem defaults, write_through: variations, concurrent
  # lifecycles) are covered more cheaply in test-integration.yml instead.
  #
  # Runs a real sandboxed step with filesystem_audit under each filesystem_mode
  # and checks the tracer recorded its file accesses; a test-hooks build
  # surfaces the recording for the assertion.
  test_sandbox_filesystem_audit:
    needs: changes
    # !cancelled() forces this to evaluate when `changes` is skipped (it runs
    # only on pull_request); a skipped need otherwise skips the job unevaluated.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.test_sandbox == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        # One job per kernel that GitHub-hosted runners ship, covering each
        # architecture and each filesystem_mode twice. Kernel-dependent
        # failures have so far always hit both architectures at once.
        #
        # The audit mode, runner read-only, enforcement and concurrency cases
        # need the same image, so they ride along here rather than take a
        # runner of their own. The runner's install directory differs between
        # architectures, so its read-only check runs on both.
        include:
          - { runner: ubuntu-22.04-arm, filesystem_mode: ephemeral, concurrency: true }
          - runner: ubuntu-24.04
            filesystem_mode: persistent
            audit_mode: true
            runner_read_only: true
            enforcement: true
            concurrency: true
          - { runner: ubuntu-24.04-arm, filesystem_mode: persistent, runner_read_only: true }
          - { runner: ubuntu-26.04, filesystem_mode: ephemeral }
    runs-on: ${{ matrix.runner }}
    # Well above a normal run; without a limit a hang holds a runner for six
    # hours.
    timeout-minutes: 15
    permissions:
      contents: read
    name: "e2e: test (filesystem_audit, ${{ matrix.filesystem_mode }}${{ matrix.audit_mode && ', audit mode' || '' }}${{ matrix.runner_read_only && ', runner read-only' || '' }}${{ matrix.enforcement && ', enforcement, config_file' || '' }}${{ matrix.concurrency && ', concurrency' || '' }}, ${{ matrix.runner }})"

    env:
      PROXY_ENGINE: universal

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the local proxy
        id: local_proxy
        uses: ./.github/actions/prepare-local-proxy
        with:
          engines: universal

      # Verifies audit mode's Job Summary includes the auto-generated
      # restrict-mode example.
      - name: Run an isolated command in audit mode
        if: matrix.audit_mode
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_proxy.outputs.universal }}
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-audit-summary.md
        with:
          proxy_engine: universal
          proxy_mode: audit
          run: |
            wget -q -T 5 -O /dev/null http://example.com/
            wget -q -T 5 -O /dev/null https://example.com/

      - name: Verify the audit-mode report includes a restrict-mode example
        if: matrix.audit_mode
        env:
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-audit-summary.md
        run: ./test/assert-sandbox-audit.sh

      # The sandbox cannot write to the runner's install directory or the
      # action checkouts. The shell's parent is the runner's bin/Runner.Worker.
      - name: Locate the runner's install directory
        if: matrix.runner_read_only
        run: |
          root=$(dirname "$(dirname "$(readlink -f "/proc/$PPID/exe")")")
          test -d "$root/externals"
          echo "The runner is installed in $root (HOME is $HOME)"
          echo "RUNNER_INSTALL_DIR=$root" >> "$GITHUB_ENV"

      - name: Try to write to the runner and the action checkouts
        if: matrix.runner_read_only
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_proxy.outputs.universal }}
        with:
          proxy_engine: universal
          proxy_mode: audit
          run: |
            rc=0
            for dir in "$RUNNER_INSTALL_DIR/externals" "$(dirname "$RUNNER_WORKSPACE")/_actions"; do
              if ! test -d "$dir"; then
                echo "UNEXPECTED: $dir is not in the sandbox"
                rc=1
              elif touch "$dir/.buildcage-probe" 2>/dev/null; then
                echo "UNEXPECTED: $dir was writable"
                rc=1
              else
                echo "OK: $dir is read-only"
              fi
            done
            exit $rc

      - name: Leave a file and a directory in the workspace the step does not own
        run: sudo touch "$GITHUB_WORKSPACE/root-owned.txt" && sudo mkdir "$GITHUB_WORKSPACE/root-owned"

      # Built outside the audited step, so the compile stays out of its record.
      - name: Build a program that makes a 32-bit syscall
        if: runner.arch == 'X64'
        run: |
          printf 'int main(void){long r;__asm__ volatile("int $0x80":"=a"(r):"a"(20L));return r < 0;}' |
            gcc -x c -o "$GITHUB_WORKSPACE/int80" -

      - name: Run a step with filesystem_audit enabled
        id: audit
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_proxy.outputs.universal }}
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/summary.md
          BUILDCAGE_RUN_DEBUG_RAW_FILE: ${{ runner.temp }}/raw.jsonl
        with:
          proxy_engine: universal
          proxy_mode: audit
          filesystem_mode: ${{ matrix.filesystem_mode }}
          filesystem_audit: record
          upload_filesystem_audit_artifact: true
          # Sourced so the step's own shell makes the accesses.
          run: . "$GITHUB_WORKSPACE/test/filesystem-audit/probe.sh"

      - name: Verify the Job Summary has the filesystem audit
        env:
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/summary.md
        run: |
          echo "::group::Filesystem audit summary"; cat "$BUILDCAGE_RUN_DEBUG_SUMMARY_FILE"; echo "::endgroup::"
          # The raw recording (before stripping) feeds the committed fixtures.
          echo "::group::Raw recording"; cat "${{ runner.temp }}/raw.jsonl" 2>/dev/null || true; echo "::endgroup::"
          ./test/assert-filesystem-audit.sh

      - name: Download and check the filesystem audit artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.audit.outputs.filesystem_audit_artifact_name }}
          path: ${{ runner.temp }}/audit
      - name: The artifact holds the step's events with buildcage's own stripped out
        run: ./test/assert-filesystem-audit-artifact.sh "$RUNNER_TEMP/audit"

      - name: The tracer and the sandbox's cgroup are gone after the step
        run: ./test/assert-no-audit-leftovers.sh

      - name: The post step removes the audit's files
        run: ./test/drive-post-step.sh

      - name: Run an ephemeral step with filesystem_audit enabled
        id: ephemeral_audit
        if: matrix.filesystem_mode == 'ephemeral'
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_proxy.outputs.universal }}
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/ephemeral-summary.md
          BUILDCAGE_RUN_DEBUG_RAW_FILE: ${{ runner.temp }}/ephemeral-raw.jsonl
        with:
          proxy_engine: universal
          proxy_mode: audit
          filesystem_mode: ephemeral
          filesystem_audit: record
          write_through: |
            $GITHUB_OUTPUT
            ./kept
          run: |
            echo probe=kept >> "$GITHUB_OUTPUT"
            echo 'From the command' >> "$GITHUB_STEP_SUMMARY"
            echo data > "$GITHUB_WORKSPACE/kept/written.txt"
            echo data > "$GITHUB_WORKSPACE/discarded.txt"
            # Files the checkout left on the overlay's lower layer, each
            # copied up by the change.
            echo appended >> "$GITHUB_WORKSPACE/README.md"
            chmod 600 "$GITHUB_WORKSPACE/LICENSE"
            mv "$GITHUB_WORKSPACE/SECURITY.md" "$GITHUB_WORKSPACE/SECURITY.moved"
            rm "$GITHUB_WORKSPACE/MAINTAINERS.md"
            python3 -c 'import ctypes, mmap, os, sys
            f = os.open(sys.argv[1], os.O_RDWR)
            m = mmap.mmap(f, 0)
            libc = ctypes.CDLL(None)
            addr = ctypes.addressof(ctypes.c_char.from_buffer(m))
            assert libc.mprotect(ctypes.c_void_p(addr), mmap.PAGESIZE, 7) == 0' "$GITHUB_WORKSPACE/renovate.json"

      - name: Verify the ephemeral step's record and what it left
        if: matrix.filesystem_mode == 'ephemeral'
        env:
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/ephemeral-summary.md
          PROBE_OUTPUT: ${{ steps.ephemeral_audit.outputs.probe }}
        run: |
          echo "::group::Filesystem audit summary"; cat "$BUILDCAGE_RUN_DEBUG_SUMMARY_FILE"; echo "::endgroup::"
          echo "::group::Raw recording"; cat "${{ runner.temp }}/ephemeral-raw.jsonl" 2>/dev/null || true; echo "::endgroup::"
          ./test/assert-filesystem-audit-ephemeral.sh

      - name: The post step removes the ephemeral step's audit files
        if: matrix.filesystem_mode == 'ephemeral'
        run: ./test/drive-post-step.sh

      # One representative case through the real action wrapper, against real
      # internet hosts (no fixture network), proves proxy_engine: universal
      # wiring end-to-end: an allowed host reaches its origin, a blocked one does
      # not, and both verdicts reach the report.
      # Which names, ports and protocols are judged which way, and the log-line
      # sanitizing behind that, live in test/scenarios/universal-restrict.sh,
      # which needs a fixture network this job deliberately does not set up.
      - name: Run an isolated command via the real action
        if: matrix.enforcement
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_proxy.outputs.universal }}
          # A later step can't read this step's GITHUB_STEP_SUMMARY back
          # (GitHub ignores attempts to reassign it), so mirror it here too.
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-test-summary.md
        with:
          proxy_engine: universal
          allowed_https_rules: example.com:443
          allowed_http_rules: example.com:80
          # Blocked connections below are expected, not a failure.
          fail_on_blocked: false
          run: |
            echo "=== allowlisted HTTP host must be reachable ==="
            wget -q -T 5 -O /dev/null http://example.com/

            echo "=== allowlisted HTTPS host must be reachable ==="
            wget -q -T 5 -O /dev/null https://example.com/

            echo "=== non-allowlisted HTTP host must be blocked (isolation-escape check) ==="
            if wget -q -T 5 -O /dev/null http://neverssl.com/ 2>&1; then
              echo "UNEXPECTED: neverssl.com was reachable"
              exit 1
            fi
            echo "OK: neverssl.com correctly blocked"

            echo "=== non-allowlisted HTTPS host must be blocked ==="
            if wget -q -T 5 -O /dev/null https://example.org/ 2>&1; then
              echo "UNEXPECTED: example.org (HTTPS) was reachable"
              exit 1
            fi
            echo "OK: example.org (HTTPS) correctly blocked"

      - name: Verify the sandbox report contains the expected allowed/blocked entries
        if: always() && matrix.enforcement
        env:
          # Same debug-only mirror as the step above, not GITHUB_STEP_SUMMARY.
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-test-summary.md
        run: ./test/assert-sandbox.sh

      # config_file through the real action: the engine, the rules and
      # fail_on_blocked it sets all reach the step. The image is universal either
      # way, so the step checks for the CA inspect would have put in the sandbox.
      - name: Write the config file
        if: matrix.enforcement
        run: |
          mkdir -p e2e-config
          cat > e2e-config/buildcage.yml <<'YAML'
          proxy_engine: universal
          # The blocked request below is expected.
          fail_on_blocked: false
          allowed_https_rules: |
            example.com:443
          YAML

      - name: Run an isolated command configured by the file
        if: matrix.enforcement
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_proxy.outputs.universal }}
        with:
          config_file: e2e-config/buildcage.yml
          run: |
            echo "=== the engine the file sets must be the one in use ==="
            if [ -e /dev/buildcage-ca.pem ]; then
              echo "UNEXPECTED: the inspect engine's CA is in the sandbox"
              exit 1
            fi

            echo "=== a host the file allows must be reachable ==="
            wget -q -T 5 -O /dev/null https://example.com/

            echo "=== a host the file does not allow must be blocked ==="
            if wget -q -T 5 -O /dev/null https://example.org/ 2>&1; then
              echo "UNEXPECTED: example.org was reachable"
              exit 1
            fi

      # A step's proposed expected_filesystem_rules, added to a config file for
      # the same command, take every access it makes again.
      - name: Record a step for its proposed rules
        id: rules_record
        if: matrix.enforcement
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_proxy.outputs.universal }}
        with:
          proxy_engine: universal
          proxy_mode: audit
          filesystem_audit: record
          upload_filesystem_audit_artifact: true
          label: rules recorded
          run: |
            cat /etc/hostname > /dev/null
            echo probe > "$GITHUB_WORKSPACE/rules-probe.txt"

      - name: Download the proposed rules
        if: matrix.enforcement
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.rules_record.outputs.filesystem_audit_artifact_name }}
          path: ${{ runner.temp }}/rules

      - name: Add the proposed rules to a config file
        if: matrix.enforcement
        run: |
          {
            echo "filesystem_audit: record"
            echo "expected_filesystem_rules: |"
            grep -v '^#' "$RUNNER_TEMP"/rules/expected-filesystem-rules-to-add.txt | sed 's/^/  /'
          } > e2e-config/expected-rules.yml
          cat e2e-config/expected-rules.yml

      - name: Run the same command with the proposed rules
        if: matrix.enforcement
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_proxy.outputs.universal }}
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/rules-summary.md
        with:
          proxy_engine: universal
          proxy_mode: audit
          config_file: e2e-config/expected-rules.yml
          fail_on_unexpected_file_access: true
          label: rules checked
          run: |
            cat /etc/hostname > /dev/null
            echo probe > "$GITHUB_WORKSPACE/rules-probe.txt"

      - name: Verify the rules took every access
        if: matrix.enforcement
        run: |
          cat "$RUNNER_TEMP/rules-summary.md"
          grep -qF 'No access fell outside `expected_filesystem_rules`.' "$RUNNER_TEMP/rules-summary.md"
          # Nothing is left to add, so no rules are proposed or pointed to.
          if grep -qF 'Expected filesystem rules' "$RUNNER_TEMP/rules-summary.md"; then
            echo "::error::a run whose rules took every access still shows the Expected filesystem rules element"
            exit 1
          fi

      # Run here so the failed-start checks below find no file of these steps.
      - name: The post step removes the rules steps' files
        if: matrix.enforcement
        run: ./test/drive-post-step.sh

      # Container/network/Compose-project namespacing holds under Actions' own
      # `parallel:` keyword; the direct-script counterpart is in
      # test-integration.yml.
      - parallel:
          - name: sandbox-parallel-a
            id: parallel_a
            if: matrix.concurrency
            uses: ./
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_proxy.outputs.universal }}
              BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-parallel-a-summary.md
            with:
              proxy_engine: universal
              allowed_https_rules: example.com:443
              allowed_http_rules: example.com:80
              label: parallel-a
              fail_on_blocked: false
              run: |
                sleep 5
                wget -q -T 5 -O /dev/null http://example.com/
                if wget -q -T 5 -O /dev/null http://example.net/ 2>&1; then
                  echo "::error::cross-talk: example.net (step B's allowlist) was reachable from step A"; exit 1
                fi

          - name: sandbox-parallel-b
            id: parallel_b
            if: matrix.concurrency
            uses: ./
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_proxy.outputs.universal }}
              BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-parallel-b-summary.md
            with:
              proxy_engine: universal
              allowed_https_rules: example.net:443
              allowed_http_rules: example.net:80
              label: parallel-b
              fail_on_blocked: false
              run: |
                wget -q -T 5 -O /dev/null http://example.net/
                if wget -q -T 5 -O /dev/null http://example.com/ 2>&1; then
                  echo "::error::cross-talk: example.com (step A's allowlist) was reachable from step B"; exit 1
                fi

      - name: Verify no leftover buildcage-proxy containers/networks after the parallel steps
        if: always() && matrix.concurrency
        run: |
          LEFTOVER_C=$(docker ps -a --filter "name=buildcage-proxy-" -q)
          LEFTOVER_N=$(docker network ls --filter "name=buildcage-proxy-" -q)
          if [ -n "$LEFTOVER_C" ] || [ -n "$LEFTOVER_N" ]; then
            echo "::error::leftover buildcage-proxy containers/networks found after parallel sandbox steps"
            exit 1
          fi

      # Every step makes the same missing write_through targets at once, and
      # the targets stay after each of them ends.
      - parallel:
          - name: sandbox-parallel-write-through-short-persistent
            if: matrix.concurrency
            uses: ./
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_proxy.outputs.universal }}
            with:
              proxy_engine: universal
              label: parallel-write-through-short-persistent
              write_through: |
                ./out
                ./out-empty
              run: "true"

          - name: sandbox-parallel-write-through-short-ephemeral
            if: matrix.concurrency
            uses: ./
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_proxy.outputs.universal }}
            with:
              proxy_engine: universal
              filesystem_mode: ephemeral
              label: parallel-write-through-short-ephemeral
              write_through: |
                ./out
                ./out-empty
              run: "true"

          - name: sandbox-parallel-write-through-long
            if: matrix.concurrency
            uses: ./
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_proxy.outputs.universal }}
            with:
              proxy_engine: universal
              filesystem_mode: ephemeral
              label: parallel-write-through-long
              write_through: |
                ./out
                ./out-empty
              run: |
                sleep 15
                echo written > ./out/file

      - name: Verify the write_through targets were kept
        if: matrix.concurrency
        run: |
          if [ "$(cat out/file 2>/dev/null)" != "written" ]; then
            echo "::error::the long step's write to ./out/file did not reach the runner"
            exit 1
          fi
          if [ ! -d out-empty ]; then
            echo "::error::./out-empty was removed after the steps ended"
            exit 1
          fi
          echo "OK: the write reached the runner, and both targets were kept"

      # After every other check, as these leave the kernel's BTF unusable for
      # the rest of the job, post steps included. An empty file is caught by
      # the action's own check, before the proxy starts.
      - name: Empty the kernel's BTF
        run: |
          sudo mount --bind "$(mktemp)" /sys/kernel/btf/vmlinux
          if [ -s /sys/kernel/btf/vmlinux ]; then echo "::error::the kernel's BTF is not empty"; exit 1; fi

      # Run directly rather than through `uses:`, so the log shows which check refused it.
      - name: A step on a kernel that exposes no BTF fails before its command
        env:
          INPUT_PROXY_ENGINE: universal
          INPUT_PROXY_MODE: audit
          INPUT_FILESYSTEM_MODE: ${{ matrix.filesystem_mode }}
          INPUT_FILESYSTEM_AUDIT: record
          INPUT_RUN: touch "$GITHUB_WORKSPACE/should-not-run"
        run: |
          if node dist/main.cjs > "$RUNNER_TEMP/no-btf.log" 2>&1; then cat "$RUNNER_TEMP/no-btf.log"; echo "::error::the step did not fail"; exit 1; fi
          if ! grep -q 'filesystem_audit could not start (the kernel exposes no BTF)' "$RUNNER_TEMP/no-btf.log"; then
            cat "$RUNNER_TEMP/no-btf.log"; echo "::error::the step failed for another reason"; exit 1
          fi
          if [ -e "$GITHUB_WORKSPACE/should-not-run" ]; then echo "::error::the command ran"; exit 1; fi

      # A non-empty file that is not BTF passes that check, so the tracer
      # fails to load after it has made the sandbox's cgroup.
      - name: Replace the kernel's BTF with a file that is not BTF
        run: |
          f=$(mktemp)
          head -c 4096 /dev/zero > "$f"
          sudo mount --bind "$f" /sys/kernel/btf/vmlinux
          if [ ! -s /sys/kernel/btf/vmlinux ]; then echo "::error::the kernel's BTF is empty"; exit 1; fi

      - name: Run a step whose tracer cannot start
        id: unstarted
        continue-on-error: true
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_proxy.outputs.universal }}
        with:
          proxy_engine: universal
          proxy_mode: audit
          filesystem_mode: ${{ matrix.filesystem_mode }}
          filesystem_audit: record
          run: touch "$GITHUB_WORKSPACE/should-not-run"

      - name: The step failed before its command, and left no tracer, cgroup or file
        env:
          OUTCOME: ${{ steps.unstarted.outcome }}
        run: |
          if [ "$OUTCOME" != failure ]; then echo "::error::the step did not fail ($OUTCOME)"; exit 1; fi
          if [ -e "$GITHUB_WORKSPACE/should-not-run" ]; then echo "::error::the command ran"; exit 1; fi
          ./test/assert-no-audit-leftovers.sh --no-files

  # Runs the inspect engine through the real action, and checks that a
  # concurrent step ending does not detach an inspect step's CA mount or NSS
  # database. On ubuntu-22.04 an ending step also runs with the universal
  # engine and Chrome reads a page through the proxy. The arm64 entry is the
  # only run of inspect on that architecture and builds the inspect image
  # alone; its runner image has no Chrome.
  test_sandbox_inspect:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.test_sandbox == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest's hosts already run the inspect integration tests.
          - { runner: ubuntu-22.04, universal: true, chrome: true }
          - { runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    name: "e2e: test (sandbox, inspect engine, concurrency, ${{ matrix.runner }})"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the local proxy
        id: local_proxy
        uses: ./.github/actions/prepare-local-proxy
        with:
          engines: ${{ matrix.universal && 'universal inspect' || 'inspect' }}

      # One representative case through the real action wrapper, against real
      # internet hosts (no fixture network), proves proxy_engine: inspect wiring
      # end-to-end: engine selection, method/path enforcement via
      # allowed_url_rules, TLS passthrough via allowed_tls_rules, and CA trust (a
      # plain https GET succeeding with no --insecure, despite the proxy
      # terminating TLS). Deeper scenario coverage (SSRF/forged-Host/DNS
      # non-leak/wildcard host+path/CA residue) lives in
      # test/integration-test-inspect-restrict.sh, which needs a fixture network
      # this job deliberately does not set up.
      - name: "Run an isolated command via the real action (proxy_engine: inspect)"
        id: sandbox
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_proxy.outputs.inspect }}
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-inspect-summary.md
        with:
          proxy_engine: inspect
          allowed_url_rules: "GET|HEAD https://example.com/**"
          allowed_tls_rules: "github.com:443"
          # Blocked connections below are expected, not a failure.
          fail_on_blocked: false
          # Short retention: this e2e run's own artifacts shouldn't linger.
          upload_traffic_artifact: true
          traffic_artifact_retention_days: 1
          run: |
            echo "=== URL-allowed host, over TLS the proxy terminated (proves CA trust) ==="
            curl -fsS --max-time 10 https://example.com/ > /dev/null

            echo "=== method outside the rule must be blocked ==="
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 -X POST https://example.com/)
            if [ "$CODE" != "403" ]; then
              echo "UNEXPECTED: POST https://example.com/ returned $CODE, not 403"
              exit 1
            fi

            echo "=== host outside allowed_url_rules must be blocked ==="
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://neverssl.com/)
            if [ "$CODE" != "403" ]; then
              echo "UNEXPECTED: https://neverssl.com/ returned $CODE, not 403"
              exit 1
            fi

            echo "=== allowed_tls_rules host: passed through undecrypted, real cert visible ==="
            curl -fsS --max-time 10 https://github.com/ > /dev/null

      - name: Verify the sandbox report contains the expected allowed/blocked entries
        if: always()
        env:
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-inspect-summary.md
        run: ./test/assert-sandbox-inspect.sh

      - name: Check the traffic_artifact_name output was set
        run: |
          if [ -z "${{ steps.sandbox.outputs.traffic_artifact_name }}" ]; then
            echo "::error::traffic_artifact_name output was empty despite upload_traffic_artifact: true"
            exit 1
          fi

      # Downloading by the exact name from the output above, rather than
      # matching buildcage-traffic-* by pattern, proves the output itself is
      # both set and correct.
      - name: Download the traffic artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.sandbox.outputs.traffic_artifact_name }}
          path: ${{ runner.temp }}/buildcage-traffic

      - name: Verify the traffic artifact
        run: node test/assert-inspect-traffic-artifact.mjs "$RUNNER_TEMP/buildcage-traffic/traffic.json"

      - parallel:
          - name: sandbox-parallel-short-universal
            if: matrix.universal
            uses: ./
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_proxy.outputs.universal }}
            with:
              proxy_engine: universal
              allowed_https_rules: example.com:443
              label: parallel-short
              run: wget -q -T 5 -O /dev/null https://example.com/

          - name: sandbox-parallel-long-inspect
            if: matrix.universal
            uses: ./
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_proxy.outputs.inspect }}
            with:
              proxy_engine: inspect
              allowed_url_rules: "GET https://example.com/**"
              label: parallel-long
              run: |
                # Let the other step finish and clean up first.
                sleep 15
                if ! test -s "$NODE_EXTRA_CA_CERTS"; then
                  echo "::error::NODE_EXTRA_CA_CERTS ($NODE_EXTRA_CA_CERTS) is gone after the concurrent step ended"
                  exit 1
                fi
                node -e '
                  require("node:https")
                    .get("https://example.com/", (res) => {
                      console.log("status " + res.statusCode);
                      process.exit(res.statusCode === 200 ? 0 : 1);
                    })
                    .on("error", (e) => {
                      console.log("::error::Node did not trust the proxy CA: " + e.message);
                      process.exit(1);
                    });
                '

      - name: Verify no CA file was left on the host
        if: always()
        run: |
          for f in /etc/buildcage-ca.pem /dev/buildcage-ca.pem; do
            if [ -e "$f" ]; then
              echo "::error::$f exists on the host after the sandbox steps"
              exit 1
            fi
          done
          echo "OK: no CA file on the host"

      # The hosted image has no NSS database, so every step below makes
      # ~/.pki/nssdb. The short steps must not remove it under the long one.
      - name: Start without an NSS database
        run: rm -rf ~/.pki ~/.local/share/pki "/var/tmp/buildcage-$(id -u)/nssdb-ledger.json"

      - name: sandbox-ephemeral-inspect-home-overlay
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_proxy.outputs.inspect }}
        with:
          proxy_engine: inspect
          filesystem_mode: ephemeral
          label: ephemeral-nssdb
          run: grep -q nssdb /proc/self/mountinfo && test -d ~/.pki/nssdb

      # Made in HOME's overlay, so neither the runner nor the ledger is touched.
      - name: Verify the ephemeral step made nothing on the runner
        id: nssdb-ephemeral
        run: |
          for f in ~/.pki "/var/tmp/buildcage-$(id -u)/nssdb-ledger.json"; do
            if [ -e "$f" ]; then
              echo "::error::$f exists after an ephemeral step"
              exit 1
            fi
          done

      - parallel:
          - name: sandbox-parallel-short-inspect-persistent
            uses: ./
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_proxy.outputs.inspect }}
            with:
              proxy_engine: inspect
              label: parallel-nssdb-short-persistent
              run: "true"

          - name: sandbox-parallel-short-inspect-ephemeral
            uses: ./
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_proxy.outputs.inspect }}
            with:
              proxy_engine: inspect
              filesystem_mode: ephemeral
              label: parallel-nssdb-short-ephemeral
              run: "true"

          - name: sandbox-parallel-long-inspect-chrome
            uses: ./
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_proxy.outputs.inspect }}
              CHROME: ${{ matrix.chrome && '1' || '' }}
            with:
              proxy_engine: inspect
              allowed_url_rules: "GET https://example.com/**"
              label: parallel-nssdb-long
              # Chrome's own background requests are blocked, and are not what this checks.
              fail_on_blocked: false
              run: |
                sleep 15
                if ! grep -q nssdb /proc/self/mountinfo; then
                  echo "::error::the NSS database mount is gone after the concurrent steps ended"
                  exit 1
                fi
                if [ -n "$CHROME" ]; then
                  dom=$(google-chrome --headless=new --no-sandbox --dump-dom https://example.com/ 2>/dev/null)
                  if ! grep -q "Example Domain" <<<"$dom"; then
                    echo "::error::Chrome did not trust the proxy CA"
                    exit 1
                  fi
                fi

      # Only once the parallel steps were reached: a failure earlier skips them,
      # and this would then report their missing database instead.
      - name: Verify the NSS database's directories were settled
        if: ${{ !cancelled() && steps.nssdb-ephemeral.outcome == 'success' }}
        env:
          CHROME: ${{ matrix.chrome && '1' || '' }}
        run: |
          ledger="/var/tmp/buildcage-$(id -u)/nssdb-ledger.json"
          if [ ! -e "$ledger" ]; then
            echo "::error::$ledger is missing after the persistent steps"
            exit 1
          fi
          cat "$ledger"
          if [ "$(jq -c '[.dirs, .uses]' "$ledger")" != "[{},{}]" ]; then
            echo "::error::$ledger still lists directories or uses after every step ended"
            exit 1
          fi
          if { [ -n "$CHROME" ] && [ ! -e ~/.pki/nssdb/cert9.db ]; } || grep -rqs buildcage ~/.pki/nssdb; then
            echo "::error::the database Chrome made is missing, or the slot is still in the database"
            ls -laR ~/.pki || true
            exit 1
          fi
          echo "OK: every step's use ended, and no slot was left in the database"

  # The AWS access key check against the real STS, which a fixture origin
  # cannot stand in for: the check depends on the shape of real clients'
  # requests and STS's answers. A job of its own so only it gets an OIDC
  # token, and only in this repository, whose environment holds the roles.
  test_sandbox_aws_key_check:
    needs: changes
    if: ${{ !cancelled() && github.repository == 'buildcage/isolated-run' && (github.event_name != 'pull_request' || (needs.changes.outputs.test_sandbox == 'true' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The role trusts only jobs in this environment. Its only permission is
    # assuming a second role, which has none.
    environment: aws-e2e
    permissions:
      contents: read
      id-token: write
    name: "e2e: test (sandbox, inspect engine, AWS access key check)"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the local proxy
        id: local_proxy
        uses: ./.github/actions/prepare-local-proxy
        with:
          engines: inspect

      - name: Get the role's keys through OIDC
        id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Read the roles' accounts
        id: accounts
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          SWITCHED_ROLE_ARN: ${{ vars.AWS_SWITCHED_ROLE_ARN }}
        run: |
          account() { local rest="${1#arn:*:iam::}"; echo "${rest%%:*}"; }
          echo "role=$(account "$ROLE_ARN")" >> "$GITHUB_OUTPUT"
          echo "switched=$(account "$SWITCHED_ROLE_ARN")" >> "$GITHUB_OUTPUT"

      # The step's command cannot request one from GitHub.
      - name: Get a web identity token for the step to exchange
        run: |
          curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value > web-identity-token

      - name: Call STS with the AWS access key check in restrict mode
        id: restrict
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_proxy.outputs.inspect }}
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/aws-restrict-summary.md
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          SWITCHED_ROLE_ARN: ${{ vars.AWS_SWITCHED_ROLE_ARN }}
        with:
          proxy_engine: inspect
          proxy_mode: restrict
          allowed_url_rules: |
            POST https://sts.us-east-1.amazonaws.com/
          aws_key_check: true
          allowed_aws_role_accounts: ${{ steps.accounts.outputs.role }},${{ steps.accounts.outputs.switched }}
          # The block below is expected.
          fail_on_blocked: false
          upload_traffic_artifact: true
          traffic_artifact_retention_days: 1
          run: |
            echo "=== the key the step was given ==="
            aws sts get-caller-identity > /dev/null

            echo "=== a key AssumeRole issued for a role in the allowed account ==="
            (
              read -r AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN < <(
                aws sts assume-role --role-arn "$SWITCHED_ROLE_ARN" --role-session-name buildcage-e2e \
                  --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text
              )
              export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
              arn=$(aws sts get-caller-identity --query Arn --output text)
              case "$arn" in
                *":assumed-role/${SWITCHED_ROLE_ARN##*/}/buildcage-e2e") ;;
                *) echo "UNEXPECTED: signed as $arn, not the switched role"; exit 1 ;;
              esac
            )

            echo "=== a key AssumeRoleWithWebIdentity issued, through the CLI's own credential provider ==="
            arn=$(env -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN \
              AWS_ROLE_ARN="$ROLE_ARN" AWS_ROLE_SESSION_NAME=buildcage-e2e-web-identity \
              AWS_WEB_IDENTITY_TOKEN_FILE="$GITHUB_WORKSPACE/web-identity-token" \
              aws sts get-caller-identity --query Arn --output text)
            case "$arn" in
              *":assumed-role/${ROLE_ARN##*/}/buildcage-e2e-web-identity") ;;
              *) echo "UNEXPECTED: signed as $arn, not the web identity session"; exit 1 ;;
            esac

            echo "=== a key from outside the step must be blocked ==="
            # AWS's documented example key ID, built at run time so the file
            # holds no key-shaped literal.
            if out=$(env -u AWS_SESSION_TOKEN AWS_ACCESS_KEY_ID="AKIA$(printf IOSFODNN7EXAMPLE)" AWS_SECRET_ACCESS_KEY=example \
              aws sts get-caller-identity 2>&1); then
              echo "UNEXPECTED: the call signed with a key from outside the step got through"
              exit 1
            fi
            echo "$out"
            # STS's own answer to an unknown key: the call left the proxy.
            if grep -q InvalidClientTokenId <<<"$out"; then
              echo "UNEXPECTED: STS rejected the call, so the proxy did not block it"
              exit 1
            fi

      - name: Remove the web identity token
        if: always()
        run: rm -f web-identity-token

      - name: Verify the restrict-mode report
        if: always() && steps.restrict.outcome != 'skipped'
        env:
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/aws-restrict-summary.md
        run: ./test/assert-sandbox-aws-key-check.sh restrict

      - name: Check the traffic_artifact_name output was set
        env:
          NAME: ${{ steps.restrict.outputs.traffic_artifact_name }}
        run: |
          if [ -z "$NAME" ]; then
            echo "::error::traffic_artifact_name output was empty despite upload_traffic_artifact: true"
            exit 1
          fi

      - name: Download the traffic artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.restrict.outputs.traffic_artifact_name }}
          path: ${{ runner.temp }}/aws-traffic

      - name: Verify the traffic artifact's aws objects
        env:
          ROLE_ACCOUNT: ${{ steps.accounts.outputs.role }}
          SWITCHED_ACCOUNT: ${{ steps.accounts.outputs.switched }}
        run: node test/assert-aws-traffic-artifact.mjs "$RUNNER_TEMP/aws-traffic/traffic.json"

      # No account named: the switched role's key is one restrict would block,
      # and the report names its account for the workflow to check.
      - name: Call STS with the AWS access key check in audit mode
        id: audit
        if: ${{ !cancelled() && steps.accounts.outcome == 'success' }}
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_proxy.outputs.inspect }}
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/aws-audit-summary.md
          SWITCHED_ROLE_ARN: ${{ vars.AWS_SWITCHED_ROLE_ARN }}
        with:
          proxy_engine: inspect
          proxy_mode: audit
          aws_key_check: true
          run: |
            aws sts get-caller-identity > /dev/null
            read -r AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN < <(
              aws sts assume-role --role-arn "$SWITCHED_ROLE_ARN" --role-session-name buildcage-e2e \
                --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text
            )
            export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
            aws sts get-caller-identity > /dev/null

      - name: Verify the audit-mode report
        if: always() && steps.audit.outcome != 'skipped'
        env:
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/aws-audit-summary.md
          SWITCHED_ACCOUNT: ${{ steps.accounts.outputs.switched }}
        run: ./test/assert-sandbox-aws-key-check.sh audit

  # Single, stably-named required status check for branch protection: the
  # jobs above vary their own names by matrix entry, so branch protection
  # can't target them directly without listing every combination.
  e2e-tests-passed:
    name: E2E tests passed
    runs-on: ubuntu-slim
    timeout-minutes: 5
    needs:
      [changes, test_sandbox_filesystem_audit, test_sandbox_inspect, test_sandbox_aws_key_check]
    if: always()
    permissions: {}
    steps:
      - name: Check whether all required jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
          echo "All required jobs succeeded."
