name: Test / E2E
run-name: Test / E2E (${{ github.ref_name }})

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    name: changes
    if: github.event_name == 'pull_request'
    outputs:
      test_sandbox: ${{ steps.filter.outputs.test_sandbox }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            test_sandbox:
              - 'src/core/**'
              - 'docker/**'
              - 'compose.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'rolldown.config.js'
              - 'tsconfig.json'
              - '.github/actions/setup-vp/**'
              - '.github/workflows/test-e2e.yml'
              - 'action.yml'
              - 'src/**'
              - 'scripts/**'
              - 'test/**'

  # Exercises the real action end-to-end (uses: ./) on the actual runner
  # host — can't be validated inside a nested container (see dev/ and
  # docs/development.md).
  #
  # Split into one job per case (test_sandbox_*) so each gets its own Job
  # Summary section and status check. run-isolated.sh's own mechanics
  # (privilege drop, filesystem defaults, writable: variations, concurrent
  # lifecycles) are covered more cheaply in test-integration.yml instead.
  #
  # Verifies audit mode's Job Summary includes the auto-generated
  # restrict-mode example.
  test_sandbox_audit_mode:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test_sandbox == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "e2e: test (sandbox, audit mode)"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - name: Build local sandbox proxy image
        run: docker compose build proxy

      - name: Resolve local image ref
        id: local_image
        run: echo "ref=$(docker compose config --images proxy)" >> "$GITHUB_OUTPUT"

      - name: Rebuild the action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: vp run build

      - name: Run an isolated command in audit mode
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-audit-summary.md
        with:
          proxy_mode: audit
          run: |
            wget -q -T 5 -O /dev/null http://example.com/
            wget -q -T 5 -O /dev/null https://example.com/

      - name: Verify the audit-mode report includes a restrict-mode example
        env:
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-audit-summary.md
        run: ./test/assert-sandbox-audit.sh

      # No cleanup step: the action stops its own proxy container in its
      # finally block.

  test_sandbox_enforcement:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test_sandbox == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "e2e: test (sandbox, enforcement)"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - name: Build local sandbox proxy image
        run: docker compose build proxy

      - name: Resolve local image ref
        id: local_image
        run: echo "ref=$(docker compose config --images proxy)" >> "$GITHUB_OUTPUT"

      - name: Rebuild the action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: vp run build

      - name: Run an isolated command via the real action
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
          # A later step can't read this step's GITHUB_STEP_SUMMARY back
          # (GitHub ignores attempts to reassign it), so mirror it here too.
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-test-summary.md
        with:
          allowed_https_rules: example.com:443
          allowed_http_rules: example.com:80
          # Blocked connections below are expected, not a failure.
          fail_on_blocked: false
          # One representative writable: pattern through the real action;
          # other writable: values are cheaper to check in test-integration.yml.
          writable: /opt
          run: |
            echo "=== allowlisted HTTP host must be reachable ==="
            wget -q -T 5 -O /dev/null http://example.com/

            echo "=== allowlisted HTTPS host must be reachable ==="
            wget -q -T 5 -O /dev/null https://example.com/

            echo "=== non-allowlisted HTTP host must be blocked (isolation-escape check) ==="
            if wget -q -T 5 -O /dev/null http://neverssl.com/ 2>&1; then
              echo "UNEXPECTED: neverssl.com was reachable"
              exit 1
            fi
            echo "OK: neverssl.com correctly blocked"

            echo "=== non-allowlisted HTTPS host must be blocked ==="
            if wget -q -T 5 -O /dev/null https://example.org/ 2>&1; then
              echo "UNEXPECTED: example.org (HTTPS) was reachable"
              exit 1
            fi
            echo "OK: example.org (HTTPS) correctly blocked"

            echo "=== /opt must be writable when listed under writable: ==="
            touch /opt/.buildcage-writable-test
            rm -f /opt/.buildcage-writable-test

      - name: Verify the sandbox report contains the expected allowed/blocked entries
        if: always()
        env:
          # Same debug-only mirror as the step above, not GITHUB_STEP_SUMMARY.
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-test-summary.md
        run: ./test/assert-sandbox.sh

      # `transparent` is universal's old name, kept working permanently as an
      # alias (see resolveProxyEngine's ENGINE_ALIASES) -- this proves it
      # actually still works end-to-end, not just that it validates. Reuses
      # the same already-built local image: the alias only affects the
      # action's own input resolution, not which image BUILDCAGE_LOCAL_IMAGE_REF
      # points at.
      - name: "Run an isolated command via the real action (proxy_engine: transparent alias)"
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
        with:
          proxy_engine: transparent
          allowed_https_rules: example.com:443
          fail_on_blocked: false
          run: |
            echo "=== allowlisted host must be reachable under the transparent alias ==="
            wget -q -T 5 -O /dev/null https://example.com/

            echo "=== non-allowlisted host must be blocked under the transparent alias ==="
            if wget -q -T 5 -O /dev/null https://example.org/ 2>&1; then
              echo "UNEXPECTED: example.org was reachable"
              exit 1
            fi
            echo "OK: example.org correctly blocked"

      # No cleanup step: the action stops its own proxy container in its
      # finally block.

  # One representative case through the real action wrapper, against real
  # internet hosts (no fixture network) -- proves proxy_engine: inspect wiring
  # end-to-end: engine selection, method/path enforcement via
  # allowed_url_rules, TLS passthrough via allow_tls_rules, and CA trust (a
  # plain https GET succeeding with no --insecure, despite the proxy
  # terminating TLS). Deeper scenario coverage (SSRF/forged-Host/DNS
  # non-leak/wildcard host+path/CA residue) lives in
  # test/integration-test-inspect-restrict.sh, which needs a fixture network
  # this job deliberately does not set up.
  test_sandbox_inspect_enforcement:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test_sandbox == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "e2e: test (sandbox, inspect engine)"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - name: Build local inspect-engine proxy image
        env:
          PROXY_ENGINE: inspect
        run: docker compose build proxy

      - name: Resolve local image ref
        id: local_image
        env:
          PROXY_ENGINE: inspect
        run: echo "ref=$(docker compose config --images proxy)" >> "$GITHUB_OUTPUT"

      - name: Rebuild the action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: vp run build

      - name: "Run an isolated command via the real action (proxy_engine: inspect)"
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-inspect-summary.md
        with:
          proxy_engine: inspect
          allowed_url_rules: "GET|HEAD https://example.com/**"
          allow_tls_rules: "github.com:443"
          # Blocked connections below are expected, not a failure.
          fail_on_blocked: false
          # Short retention: this e2e run's own artifacts shouldn't linger.
          upload_traffic_artifact: true
          traffic_artifact_retention_days: 1
          run: |
            echo "=== URL-allowed host, over TLS the proxy terminated (proves CA trust) ==="
            curl -fsS --max-time 10 https://example.com/ > /dev/null

            echo "=== method outside the rule must be refused ==="
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 -X POST https://example.com/)
            if [ "$CODE" != "403" ]; then
              echo "UNEXPECTED: POST https://example.com/ returned $CODE, not 403"
              exit 1
            fi

            echo "=== host outside allowed_url_rules must be refused ==="
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://neverssl.com/)
            if [ "$CODE" != "403" ]; then
              echo "UNEXPECTED: https://neverssl.com/ returned $CODE, not 403"
              exit 1
            fi

            echo "=== allow_tls_rules host: passed through undecrypted, real cert visible ==="
            curl -fsS --max-time 10 https://github.com/ > /dev/null

      - name: Verify the sandbox report contains the expected allowed/blocked entries
        if: always()
        env:
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-inspect-summary.md
        run: ./test/assert-sandbox-inspect.sh

      # The artifact name is suffixed with this run's own proxy container ID
      # (see trafficArtifactName in src/main.ts), so this matches by pattern
      # rather than a fixed name.
      - name: Download the traffic artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: buildcage-traffic-*
          path: ${{ runner.temp }}/buildcage-traffic

      - name: Verify the traffic artifact
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const base = process.env.RUNNER_TEMP + "/buildcage-traffic";
            // download-artifact with pattern: does not always nest the one
            // matched artifact under an artifact-name subdirectory, so this
            // searches recursively instead of assuming a fixed depth.
            const file = fs.readdirSync(base, { recursive: true }).find((f) => f.endsWith("traffic.json"));
            if (!file) {
              console.log("::error::no traffic.json found under " + base);
              process.exit(1);
            }
            const rows = JSON.parse(fs.readFileSync(path.join(base, file), "utf8"));
            const methodRefused = rows.some(
              (r) => r.action === "block" && r.host === "example.com" && r.method === "POST",
            );
            const hostRefused = rows.some(
              (r) => r.action === "block" && r.host === "neverssl.com",
            );
            const passthrough = rows.some(
              (r) => r.protocol === "tls" && r.host === "github.com" && r.bytes > 0,
            );
            if (!methodRefused) {
              console.log("::error::POST to example.com was not recorded as blocked in the traffic artifact");
              process.exit(1);
            }
            if (!hostRefused) {
              console.log("::error::neverssl.com was not recorded as blocked in the traffic artifact");
              process.exit(1);
            }
            if (!passthrough) {
              console.log("::error::the github.com TLS passthrough was not recorded in the traffic artifact");
              process.exit(1);
            }
            console.log("Traffic artifact verified.");
          '

      # No cleanup step: the action stops its own proxy container in its
      # finally block.

  # fail_on_blocked defaults to true and should fail on a blocked
  # connection; known_blocked_rules should exempt a matching one. Both are
  # unit-tested at the logic level — this proves the wiring end-to-end,
  # reusing the same built image for both cases.
  test_sandbox_fail_on_blocked:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test_sandbox == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "e2e: test (sandbox, fail_on_blocked & known_blocked_rules)"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - name: Build local sandbox proxy image
        run: docker compose build proxy

      - name: Resolve local image ref
        id: local_image
        run: echo "ref=$(docker compose config --images proxy)" >> "$GITHUB_OUTPUT"

      - name: Rebuild the action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: vp run build

      - name: Run an isolated command that triggers a blocked connection
        id: blocked_connection
        continue-on-error: true
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
        with:
          allowed_https_rules: example.com:443
          allowed_http_rules: example.com:80
          # fail_on_blocked intentionally left at its default (true).
          run: wget -q -T 5 -O /dev/null http://neverssl.com/ || true

      - name: Verify fail_on_blocked actually failed the step
        if: always()
        run: |
          if [ "${{ steps.blocked_connection.outcome }}" != "failure" ]; then
            echo "::error::Expected the blocked-connection step to fail (fail_on_blocked defaults to true), but it reported '${{ steps.blocked_connection.outcome }}'"
            exit 1
          fi
          echo "OK: fail_on_blocked correctly failed the step"

      - name: Run an isolated command whose only blocked connection is known_blocked_rules-listed
        id: known_blocked_connection
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
        with:
          allowed_https_rules: example.com:443
          allowed_http_rules: example.com:80
          known_blocked_rules: neverssl.com:80
          # fail_on_blocked intentionally left at its default (true).
          run: wget -q -T 5 -O /dev/null http://neverssl.com/ || true

      - name: Verify known_blocked_rules kept the step from failing
        if: always()
        run: |
          if [ "${{ steps.known_blocked_connection.outcome }}" != "success" ]; then
            echo "::error::Expected the step to succeed (the only blocked connection matches known_blocked_rules), but it reported '${{ steps.known_blocked_connection.outcome }}'"
            exit 1
          fi
          echo "OK: known_blocked_rules correctly kept the step from failing"

      # No cleanup step: the action stops its own proxy container in its
      # finally block.

  # Proves container/network/Compose-project namespacing holds under
  # Actions' own `parallel:` keyword; the direct-script counterpart is
  # in test-integration.yml.
  test_sandbox_concurrency:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test_sandbox == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "e2e: test (sandbox, concurrency)"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - name: Build local sandbox proxy image
        run: docker compose build proxy

      - name: Resolve local image ref
        id: local_image
        run: echo "ref=$(docker compose config --images proxy)" >> "$GITHUB_OUTPUT"

      - name: Rebuild the action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: vp run build

      - parallel:
          - name: sandbox-parallel-a
            id: parallel_a
            uses: ./
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
              BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-parallel-a-summary.md
            with:
              allowed_https_rules: example.com:443
              allowed_http_rules: example.com:80
              label: parallel-a
              fail_on_blocked: false
              run: |
                sleep 5
                wget -q -T 5 -O /dev/null http://example.com/
                if wget -q -T 5 -O /dev/null http://example.net/ 2>&1; then
                  echo "::error::cross-talk: example.net (step B's allowlist) was reachable from step A"; exit 1
                fi

          - name: sandbox-parallel-b
            id: parallel_b
            uses: ./
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
              BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-parallel-b-summary.md
            with:
              allowed_https_rules: example.net:443
              allowed_http_rules: example.net:80
              label: parallel-b
              fail_on_blocked: false
              run: |
                wget -q -T 5 -O /dev/null http://example.net/
                if wget -q -T 5 -O /dev/null http://example.com/ 2>&1; then
                  echo "::error::cross-talk: example.com (step A's allowlist) was reachable from step B"; exit 1
                fi

      - name: Verify no leftover buildcage-proxy containers/networks after the parallel steps
        if: always()
        run: |
          LEFTOVER_C=$(docker ps -a --filter "name=buildcage-proxy-" -q)
          LEFTOVER_N=$(docker network ls --filter "name=buildcage-proxy-" -q)
          if [ -n "$LEFTOVER_C" ] || [ -n "$LEFTOVER_N" ]; then
            echo "::error::leftover buildcage-proxy containers/networks found after parallel sandbox steps"
            exit 1
          fi

      # No cleanup step: the action stops its own proxy container in its
      # finally block.

  # Single, stably-named required status check for branch protection: the
  # jobs above vary their own names by matrix entry, so branch protection
  # can't target them directly without listing every combination.
  e2e-tests-passed:
    name: E2E tests passed
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        test_sandbox_audit_mode,
        test_sandbox_enforcement,
        test_sandbox_inspect_enforcement,
        test_sandbox_fail_on_blocked,
        test_sandbox_concurrency,
      ]
    if: always()
    permissions: {}
    steps:
      - name: Check whether all required jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
          echo "All required jobs succeeded."
