name: Test / E2E
run-name: Test / E2E (${{ github.ref_name }})

on:
  workflow_dispatch:

  # epic/ branches gather a large change before it lands on main.
  pull_request:
    branches:
      - main
      - "epic/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    name: changes
    if: github.event_name == 'pull_request'
    outputs:
      test_sandbox: ${{ steps.filter.outputs.test_sandbox }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            test_sandbox:
              - 'src/core/**'
              - 'docker/**'
              - 'compose.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'rolldown.config.js'
              - 'rolldown.scripts.config.js'
              - 'tsconfig.json'
              - '.dockerignore'
              - '.github/actions/setup-vp/**'
              - '.github/workflows/test-e2e.yml'
              - 'action.yml'
              - 'src/**'
              - 'scripts/**'
              - 'test/**'

  # Exercises the real action end-to-end (uses: ./) on the actual runner
  # host; none of this can be validated inside a nested container (see dev/
  # and docs/development.md).
  #
  # Cases that need the same image share a job: runners, not job length, are
  # what a run waits on. run-isolated.sh's own mechanics
  # (privilege drop, filesystem defaults, write_through: variations, concurrent
  # lifecycles) are covered more cheaply in test-integration.yml instead.
  #
  # Verifies audit mode's Job Summary includes the auto-generated
  # restrict-mode example, and that the sandbox cannot write to the runner's
  # install directory or the action checkouts.
  test_sandbox_audit_mode:
    needs: changes
    # !cancelled() forces this to evaluate when `changes` is skipped (it runs
    # only on pull_request); a skipped need otherwise skips the job unevaluated.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.test_sandbox == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    name: "e2e: test (sandbox, audit mode, ${{ matrix.runner }})"

    env:
      PROXY_ENGINE: universal

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - name: Build local sandbox proxy image
        run: docker compose build proxy

      - name: Resolve local image ref
        id: local_image
        run: echo "ref=$(docker compose config --images proxy)" >> "$GITHUB_OUTPUT"

      - name: Rebuild the action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: vp run build

      - name: Run an isolated command in audit mode
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-audit-summary.md
        with:
          proxy_engine: universal
          proxy_mode: audit
          run: |
            wget -q -T 5 -O /dev/null http://example.com/
            wget -q -T 5 -O /dev/null https://example.com/

      - name: Verify the audit-mode report includes a restrict-mode example
        env:
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-audit-summary.md
        run: ./test/assert-sandbox-audit.sh

      # The shell's parent is the runner's bin/Runner.Worker.
      - name: Locate the runner's install directory
        run: |
          root=$(dirname "$(dirname "$(readlink -f "/proc/$PPID/exe")")")
          test -d "$root/externals"
          echo "The runner is installed in $root (HOME is $HOME)"
          echo "RUNNER_INSTALL_DIR=$root" >> "$GITHUB_ENV"

      - name: Try to write to the runner and the action checkouts
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
        with:
          proxy_engine: universal
          proxy_mode: audit
          run: |
            rc=0
            for dir in "$RUNNER_INSTALL_DIR/externals" "$(dirname "$RUNNER_WORKSPACE")/_actions"; do
              if touch "$dir/.buildcage-probe" 2>/dev/null; then
                echo "UNEXPECTED: $dir was writable"
                rc=1
              else
                echo "OK: $dir is read-only"
              fi
            done
            exit $rc

      # No cleanup step: the action stops its own proxy container in its
      # finally block.

  # Runs a real sandboxed step with filesystem_audit under each filesystem_mode
  # and checks the tracer recorded its file accesses; a test-hooks build
  # surfaces the recording for the assertion.
  test_sandbox_filesystem_audit:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.test_sandbox == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        filesystem_mode: [persistent, ephemeral]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    name: "e2e: test (filesystem_audit, ${{ matrix.filesystem_mode }}, ${{ matrix.runner }})"

    env:
      PROXY_ENGINE: universal

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - name: Build local sandbox proxy image
        run: docker compose build proxy

      - name: Resolve local image ref
        id: local_image
        run: echo "ref=$(docker compose config --images proxy)" >> "$GITHUB_OUTPUT"

      - name: Rebuild the action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: vp run build

      - name: Leave a file and a directory in the workspace the step does not own
        run: sudo touch "$GITHUB_WORKSPACE/root-owned.txt" && sudo mkdir "$GITHUB_WORKSPACE/root-owned"

      - name: Run a step with filesystem_audit enabled
        id: audit
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/summary.md
          BUILDCAGE_RUN_DEBUG_RAW_FILE: ${{ runner.temp }}/raw.jsonl
        with:
          proxy_engine: universal
          proxy_mode: audit
          filesystem_mode: ${{ matrix.filesystem_mode }}
          filesystem_audit: record
          run: |
            cat /etc/hostname > /dev/null
            echo probe > "$GITHUB_WORKSPACE/probe.txt"
            mv "$GITHUB_WORKSPACE/probe.txt" "$GITHUB_WORKSPACE/probe2.txt"
            rm "$GITHUB_WORKSPACE/probe2.txt"
            # A command run from a subshell that itself touches nothing.
            (cd "$GITHUB_WORKSPACE" && touch subshell.txt || true)
            # Failed calls on relative names: one against a changed working
            # directory, one against a directory passed by descriptor.
            mkdir -p "$GITHUB_WORKSPACE/sub"
            (cd "$GITHUB_WORKSPACE/sub" && cat missing.txt 2>/dev/null || true)
            python3 -c 'import os, sys; d = os.open(sys.argv[1], os.O_RDONLY)
            try: os.unlink("gone", dir_fd=d)
            except FileNotFoundError: pass' "$GITHUB_WORKSPACE/sub"
            # Changes the kernel refuses after the tracer's hook has seen them.
            chmod 777 "$GITHUB_WORKSPACE/root-owned.txt" 2>/dev/null || true
            mkdir "$GITHUB_WORKSPACE/root-owned/x" 2>/dev/null || true
            # A script run by a relative name from the directory it sits in.
            mkdir -p "$GITHUB_WORKSPACE/A"
            printf '#!/bin/sh\n' > "$GITHUB_WORKSPACE/A/run.sh"
            chmod +x "$GITHUB_WORKSPACE/A/run.sh"
            (cd "$GITHUB_WORKSPACE/A" && ./run.sh)
            # A file mapped executable that is no library.
            echo data > "$GITHUB_WORKSPACE/mapped.bin"
            python3 -c 'import mmap, sys; f = open(sys.argv[1], "rb")
            mmap.mmap(f.fileno(), 0, prot=mmap.PROT_READ | mmap.PROT_EXEC)' "$GITHUB_WORKSPACE/mapped.bin"
            # mprotect adding PROT_WRITE (and PROT_EXEC) to shared mappings.
            echo data > "$GITHUB_WORKSPACE/mprotected.bin"
            echo data > "$GITHUB_WORKSPACE/mprotected-rwx.bin"
            python3 -c 'import ctypes, os, sys
            libc = ctypes.CDLL(None)
            libc.mmap.restype = ctypes.c_void_p
            libc.mmap.argtypes = [ctypes.c_void_p, ctypes.c_size_t, ctypes.c_int, ctypes.c_int, ctypes.c_int, ctypes.c_long]
            failed = ctypes.c_void_p(-1).value
            def remap(path, prot):
                p = libc.mmap(None, 4096, 1, 1, os.open(path, os.O_RDWR), 0)  # PROT_READ, MAP_SHARED
                assert p != failed and libc.mprotect(ctypes.c_void_p(p), 4096, prot) == 0
                ctypes.memmove(p, b"X", 1)
            remap(sys.argv[1], 3)  # PROT_READ | PROT_WRITE
            remap(sys.argv[2], 7)  # PROT_READ | PROT_WRITE | PROT_EXEC
            p = libc.mmap(None, 4096, 0, 0x21, -1, 0)  # PROT_NONE, MAP_SHARED | MAP_ANONYMOUS
            assert p != failed and libc.mprotect(ctypes.c_void_p(p), 4096, 3) == 0' \
              "$GITHUB_WORKSPACE/mprotected.bin" "$GITHUB_WORKSPACE/mprotected-rwx.bin"
            # A program, not the builtin, with an argument the record must not keep.
            /usr/bin/true buildcage-audit-sentinel-arg

      - name: Verify the Job Summary has the filesystem audit
        run: |
          f="${{ runner.temp }}/summary.md"
          echo "::group::Filesystem audit summary"; cat "$f"; echo "::endgroup::"
          # The raw recording (before stripping) feeds the committed fixtures.
          echo "::group::Raw recording"; cat "${{ runner.temp }}/raw.jsonl" 2>/dev/null || true; echo "::endgroup::"
          grep -q "Filesystem audit" "$f"
          # The probe writes show as a flagged, command-tagged line under the
          # workspace, led by its elapsed time (MM:SS.mmm) and a colon.
          t='[0-9]{2}:[0-9]{2}\.[0-9]{3}'
          grep -qE "^$t(-$t)?: +[RWXMDArwxmda!]+ +\S+ +\./probe" "$f" || exit 1
          # Rows run in the order they were first touched: write, move, delete.
          w=$(grep -nE ' W +bash +\./probe\.txt$' "$f" | head -1 | cut -d: -f1)
          m=$(grep -nE ' M +mv +\./probe\.txt$' "$f" | head -1 | cut -d: -f1)
          d=$(grep -nE ' D +rm +\./probe2\.txt$' "$f" | head -1 | cut -d: -f1)
          [ -n "$w" ] && [ -n "$m" ] && [ -n "$d" ] && [ "$w" -lt "$m" ] && [ "$m" -lt "$d" ]
          # The tables list what ran and what was touched, across commands.
          # python3 is a symlink, so it shows as the versioned file it runs.
          grep -qE '^\| `/usr/bin/python3[.0-9]*` \|$' "$f"
          grep -qF '| `./A/run.sh` |' "$f"
          # touch creates its file, then sets its times through the descriptor.
          grep -qF '| WA | `./subshell.txt` |' "$f"
          grep -q '<summary>📂 Filesystem details</summary>' "$f"
          # A subshell's command still counts as the step's.
          grep -qE ' WA +touch +\./subshell\.txt$' "$f"
          # Relative names show under the directory they resolved against.
          grep -qE ' r +cat +\./sub/missing\.txt$' "$f"
          grep -qE ' d +python3 +\./sub/gone$' "$f"
          # A refused change shows only as failed.
          grep -qE ' a!? +chmod +\./root-owned\.txt$' "$f"
          grep -qE ' w!? +mkdir +\./root-owned/x$' "$f"
          # A file mapped executable shows as read unless it is a library or
          # an exec mapped it, as it does run.sh's interpreter.
          grep -qE ' R +python3 +\./mapped\.bin$' "$f"
          # Shared anonymous memory names no file.
          grep -qE ' RW +python3 +\./mprotected\.bin$' "$f"
          grep -qE ' RW +python3 +\./mprotected-rwx\.bin$' "$f"
          ! grep -q '/dev/zero' "$f"
          ! grep -q '/usr/bin/dash' "$f"
          # buildcage's own wrappers must never reach the summary.
          ! grep -qE ' (setpriv|buildcage-init|run-script\.sh) ' "$f"

      - name: Download and check the filesystem audit artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.audit.outputs.filesystem_audit_artifact_name }}
          path: ${{ runner.temp }}/audit
      - name: The artifact holds the step's events with buildcage's own stripped out
        run: |
          f=$(ls ${{ runner.temp }}/audit/*.jsonl)
          test -s "$f"
          echo "::group::Recorded events (first lines)"; head -20 "$f"; echo "::endgroup::"
          grep -q '"kind":"write"' "$f"
          # overlayfs opens a layer's directories with O_NOATIME (0o1000000) on
          # its own behalf; none of those may pass for the step's.
          n=$(jq -s '[.[] | select(.kind == "open" and ((.flags // 0) / 262144 | floor) % 2 == 1)] | length' "$f")
          [ "$n" -eq 0 ]
          # buildcage's own exec wrappers and scratch files must not leak.
          ! grep -qE '"comm":"(setpriv|buildcage-init|run-script\.sh)"' "$f"
          # A program run by a relative name is recorded under the file it
          # resolved to, the script itself rather than its interpreter, with
          # the name it was run by beside it.
          grep -qE '"kind":"exec",[^}]*"path":"/[^"]*/A/run\.sh","name":"\./run\.sh"' "$f"
          jq -se 'any(.[]; .kind == "mmap" and .path == "/usr/bin/dash" and .image == true)' "$f" > /dev/null
          ! grep -q '/var/tmp/buildcage-' "$f"
          ! grep -q 'buildcage-audit-sentinel-arg' "$f"

  # One representative case through the real action wrapper, against real
  # internet hosts (no fixture network), proves proxy_engine: universal
  # wiring end-to-end: an allowed host reaches its origin, a blocked one does
  # not, write_through: opens a path, and both verdicts reach the report.
  # Which names, ports and protocols are judged which way, and the log-line
  # sanitizing behind that, live in test/universal-restrict-scenarios.sh,
  # which needs a fixture network this job deliberately does not set up.
  test_sandbox_enforcement:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.test_sandbox == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "e2e: test (sandbox, enforcement, config_file, fail_on_blocked)"

    env:
      PROXY_ENGINE: universal

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - name: Build local sandbox proxy image
        run: docker compose build proxy

      - name: Resolve local image ref
        id: local_image
        run: echo "ref=$(docker compose config --images proxy)" >> "$GITHUB_OUTPUT"

      - name: Rebuild the action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: vp run build

      - name: Run an isolated command via the real action
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
          # A later step can't read this step's GITHUB_STEP_SUMMARY back
          # (GitHub ignores attempts to reassign it), so mirror it here too.
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-test-summary.md
        with:
          proxy_engine: universal
          allowed_https_rules: example.com:443
          allowed_http_rules: example.com:80
          # Blocked connections below are expected, not a failure.
          fail_on_blocked: false
          # One representative write_through: pattern through the real action;
          # other write_through: values are cheaper to check in test-integration.yml.
          write_through: /opt
          run: |
            echo "=== allowlisted HTTP host must be reachable ==="
            wget -q -T 5 -O /dev/null http://example.com/

            echo "=== allowlisted HTTPS host must be reachable ==="
            wget -q -T 5 -O /dev/null https://example.com/

            echo "=== non-allowlisted HTTP host must be blocked (isolation-escape check) ==="
            if wget -q -T 5 -O /dev/null http://neverssl.com/ 2>&1; then
              echo "UNEXPECTED: neverssl.com was reachable"
              exit 1
            fi
            echo "OK: neverssl.com correctly blocked"

            echo "=== non-allowlisted HTTPS host must be blocked ==="
            if wget -q -T 5 -O /dev/null https://example.org/ 2>&1; then
              echo "UNEXPECTED: example.org (HTTPS) was reachable"
              exit 1
            fi
            echo "OK: example.org (HTTPS) correctly blocked"

            echo "=== /opt must be writable when listed under write_through: ==="
            touch /opt/.buildcage-writable-test
            rm -f /opt/.buildcage-writable-test

      - name: Verify the sandbox report contains the expected allowed/blocked entries
        if: always()
        env:
          # Same debug-only mirror as the step above, not GITHUB_STEP_SUMMARY.
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-test-summary.md
        run: ./test/assert-sandbox.sh

      # config_file through the real action: the engine, the rules and
      # fail_on_blocked it sets all reach the step. The image is universal either
      # way, so the step checks for the CA inspect would have put in the sandbox.
      - name: Write the config file
        run: |
          mkdir -p e2e-config
          cat > e2e-config/buildcage.yml <<'YAML'
          proxy_engine: universal
          # The blocked request below is expected.
          fail_on_blocked: false
          allowed_https_rules: |
            example.com:443
          YAML

      - name: Run an isolated command configured by the file
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
        with:
          config_file: e2e-config/buildcage.yml
          run: |
            echo "=== the engine the file sets must be the one in use ==="
            if [ -e /dev/buildcage-ca.pem ]; then
              echo "UNEXPECTED: the inspect engine's CA is in the sandbox"
              exit 1
            fi

            echo "=== a host the file allows must be reachable ==="
            wget -q -T 5 -O /dev/null https://example.com/

            echo "=== a host the file does not allow must be blocked ==="
            if wget -q -T 5 -O /dev/null https://example.org/ 2>&1; then
              echo "UNEXPECTED: example.org was reachable"
              exit 1
            fi

      # fail_on_blocked defaults to true and should fail on a blocked
      # connection; known_blocked_rules should exempt a matching one. Both are
      # unit-tested at the logic level: this proves the wiring end-to-end,
      # reusing the same built image for both cases.
      - name: Run an isolated command that triggers a blocked connection
        id: blocked_connection
        continue-on-error: true
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
        with:
          proxy_engine: universal
          allowed_https_rules: example.com:443
          allowed_http_rules: example.com:80
          # fail_on_blocked intentionally left at its default (true).
          run: wget -q -T 5 -O /dev/null http://neverssl.com/ || true

      - name: Verify fail_on_blocked actually failed the step
        if: always() && steps.blocked_connection.outcome != 'skipped'
        run: |
          if [ "${{ steps.blocked_connection.outcome }}" != "failure" ]; then
            echo "::error::Expected the blocked-connection step to fail (fail_on_blocked defaults to true), but it reported '${{ steps.blocked_connection.outcome }}'"
            exit 1
          fi
          echo "OK: fail_on_blocked correctly failed the step"

      - name: Run an isolated command whose only blocked connection is known_blocked_rules-listed
        id: known_blocked_connection
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
        with:
          proxy_engine: universal
          allowed_https_rules: example.com:443
          allowed_http_rules: example.com:80
          known_blocked_rules: neverssl.com:80
          # fail_on_blocked intentionally left at its default (true).
          run: wget -q -T 5 -O /dev/null http://neverssl.com/ || true

      - name: Verify known_blocked_rules kept the step from failing
        if: always() && steps.known_blocked_connection.outcome != 'skipped'
        run: |
          if [ "${{ steps.known_blocked_connection.outcome }}" != "success" ]; then
            echo "::error::Expected the step to succeed (the only blocked connection matches known_blocked_rules), but it reported '${{ steps.known_blocked_connection.outcome }}'"
            exit 1
          fi
          echo "OK: known_blocked_rules correctly kept the step from failing"

  # Proves container/network/Compose-project namespacing holds under
  # Actions' own `parallel:` keyword; the direct-script counterpart is
  # in test-integration.yml.
  test_sandbox_concurrency:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.test_sandbox == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "e2e: test (sandbox, concurrency)"

    env:
      PROXY_ENGINE: universal

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - name: Build local sandbox proxy image
        run: docker compose build proxy

      - name: Resolve local image ref
        id: local_image
        run: echo "ref=$(docker compose config --images proxy)" >> "$GITHUB_OUTPUT"

      - name: Rebuild the action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: vp run build

      - parallel:
          - name: sandbox-parallel-a
            id: parallel_a
            uses: ./
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
              BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-parallel-a-summary.md
            with:
              proxy_engine: universal
              allowed_https_rules: example.com:443
              allowed_http_rules: example.com:80
              label: parallel-a
              fail_on_blocked: false
              run: |
                sleep 5
                wget -q -T 5 -O /dev/null http://example.com/
                if wget -q -T 5 -O /dev/null http://example.net/ 2>&1; then
                  echo "::error::cross-talk: example.net (step B's allowlist) was reachable from step A"; exit 1
                fi

          - name: sandbox-parallel-b
            id: parallel_b
            uses: ./
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
              BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-parallel-b-summary.md
            with:
              proxy_engine: universal
              allowed_https_rules: example.net:443
              allowed_http_rules: example.net:80
              label: parallel-b
              fail_on_blocked: false
              run: |
                wget -q -T 5 -O /dev/null http://example.net/
                if wget -q -T 5 -O /dev/null http://example.com/ 2>&1; then
                  echo "::error::cross-talk: example.com (step A's allowlist) was reachable from step B"; exit 1
                fi

      - name: Verify no leftover buildcage-proxy containers/networks after the parallel steps
        if: always()
        run: |
          LEFTOVER_C=$(docker ps -a --filter "name=buildcage-proxy-" -q)
          LEFTOVER_N=$(docker network ls --filter "name=buildcage-proxy-" -q)
          if [ -n "$LEFTOVER_C" ] || [ -n "$LEFTOVER_N" ]; then
            echo "::error::leftover buildcage-proxy containers/networks found after parallel sandbox steps"
            exit 1
          fi

      # Every step makes the same missing write_through targets at once, and
      # the targets stay after each of them ends.
      - parallel:
          - name: sandbox-parallel-write-through-short-persistent
            uses: ./
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
            with:
              proxy_engine: universal
              label: parallel-write-through-short-persistent
              write_through: |
                ./out
                ./out-empty
              run: "true"

          - name: sandbox-parallel-write-through-short-ephemeral
            uses: ./
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
            with:
              proxy_engine: universal
              filesystem_mode: ephemeral
              label: parallel-write-through-short-ephemeral
              write_through: |
                ./out
                ./out-empty
              run: "true"

          - name: sandbox-parallel-write-through-long
            uses: ./
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
            with:
              proxy_engine: universal
              filesystem_mode: ephemeral
              label: parallel-write-through-long
              write_through: |
                ./out
                ./out-empty
              run: |
                sleep 15
                echo written > ./out/file

      - name: Verify the write_through targets were kept
        if: always()
        run: |
          if [ "$(cat out/file 2>/dev/null)" != "written" ]; then
            echo "::error::the long step's write to ./out/file did not reach the runner"
            exit 1
          fi
          if [ ! -d out-empty ]; then
            echo "::error::./out-empty was removed after the steps ended"
            exit 1
          fi
          echo "OK: the write reached the runner, and both targets were kept"

  # A concurrent step ending must not detach an inspect step's CA mount,
  # whatever engine the ending step uses.
  test_sandbox_concurrency_inspect:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.test_sandbox == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "e2e: test (sandbox, inspect engine, concurrency)"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      # compose.yaml names the image the same for either engine, so each build
      # is retagged before the next one overwrites it.
      - name: Build local proxy images for both engines
        run: |
          for engine in universal inspect; do
            PROXY_ENGINE=$engine docker compose build proxy
            docker tag "$(PROXY_ENGINE=$engine docker compose config --images proxy)" "buildcage-e2e-proxy:$engine"
          done

      - name: Rebuild the action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: vp run build

      # One representative case through the real action wrapper, against real
      # internet hosts (no fixture network), proves proxy_engine: inspect wiring
      # end-to-end: engine selection, method/path enforcement via
      # allowed_url_rules, TLS passthrough via allowed_tls_rules, and CA trust (a
      # plain https GET succeeding with no --insecure, despite the proxy
      # terminating TLS). Deeper scenario coverage (SSRF/forged-Host/DNS
      # non-leak/wildcard host+path/CA residue) lives in
      # test/integration-test-inspect-restrict.sh, which needs a fixture network
      # this job deliberately does not set up.
      - name: "Run an isolated command via the real action (proxy_engine: inspect)"
        id: sandbox
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: buildcage-e2e-proxy:inspect
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-inspect-summary.md
        with:
          proxy_engine: inspect
          allowed_url_rules: "GET|HEAD https://example.com/**"
          allowed_tls_rules: "github.com:443"
          # Blocked connections below are expected, not a failure.
          fail_on_blocked: false
          # Short retention: this e2e run's own artifacts shouldn't linger.
          upload_traffic_artifact: true
          traffic_artifact_retention_days: 1
          run: |
            echo "=== URL-allowed host, over TLS the proxy terminated (proves CA trust) ==="
            curl -fsS --max-time 10 https://example.com/ > /dev/null

            echo "=== method outside the rule must be refused ==="
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 -X POST https://example.com/)
            if [ "$CODE" != "403" ]; then
              echo "UNEXPECTED: POST https://example.com/ returned $CODE, not 403"
              exit 1
            fi

            echo "=== host outside allowed_url_rules must be refused ==="
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://neverssl.com/)
            if [ "$CODE" != "403" ]; then
              echo "UNEXPECTED: https://neverssl.com/ returned $CODE, not 403"
              exit 1
            fi

            echo "=== allowed_tls_rules host: passed through undecrypted, real cert visible ==="
            curl -fsS --max-time 10 https://github.com/ > /dev/null

      - name: Verify the sandbox report contains the expected allowed/blocked entries
        if: always()
        env:
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-inspect-summary.md
        run: ./test/assert-sandbox-inspect.sh

      - name: Check the traffic_artifact_name output was set
        run: |
          if [ -z "${{ steps.sandbox.outputs.traffic_artifact_name }}" ]; then
            echo "::error::traffic_artifact_name output was empty despite upload_traffic_artifact: true"
            exit 1
          fi

      # Downloading by the exact name from the output above, rather than
      # matching buildcage-traffic-* by pattern, proves the output itself is
      # both set and correct.
      - name: Download the traffic artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.sandbox.outputs.traffic_artifact_name }}
          path: ${{ runner.temp }}/buildcage-traffic

      - name: Verify the traffic artifact
        run: |
          node -e '
            const fs = require("node:fs");
            const rows = JSON.parse(
              fs.readFileSync(process.env.RUNNER_TEMP + "/buildcage-traffic/traffic.json", "utf8"),
            );
            const methodRefused = rows.some(
              (r) => r.action === "block" && r.host === "example.com" && r.method === "POST",
            );
            const hostRefused = rows.some(
              (r) => r.action === "block" && r.host === "neverssl.com",
            );
            const passthrough = rows.some(
              (r) => r.protocol === "tls" && r.host === "github.com" && r.bytes > 0,
            );
            if (!methodRefused) {
              console.log("::error::POST to example.com was not recorded as blocked in the traffic artifact");
              process.exit(1);
            }
            if (!hostRefused) {
              console.log("::error::neverssl.com was not recorded as blocked in the traffic artifact");
              process.exit(1);
            }
            if (!passthrough) {
              console.log("::error::the github.com TLS passthrough was not recorded in the traffic artifact");
              process.exit(1);
            }
            console.log("Traffic artifact verified.");
          '

      - parallel:
          - name: sandbox-parallel-short-universal
            uses: ./
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: buildcage-e2e-proxy:universal
            with:
              proxy_engine: universal
              allowed_https_rules: example.com:443
              label: parallel-short
              run: wget -q -T 5 -O /dev/null https://example.com/

          - name: sandbox-parallel-long-inspect
            uses: ./
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: buildcage-e2e-proxy:inspect
            with:
              proxy_engine: inspect
              allowed_url_rules: "GET https://example.com/**"
              label: parallel-long
              run: |
                # Let the other step finish and clean up first.
                sleep 15
                if ! test -s "$NODE_EXTRA_CA_CERTS"; then
                  echo "::error::NODE_EXTRA_CA_CERTS ($NODE_EXTRA_CA_CERTS) is gone after the concurrent step ended"
                  exit 1
                fi
                node -e '
                  require("node:https")
                    .get("https://example.com/", (res) => {
                      console.log("status " + res.statusCode);
                      process.exit(res.statusCode === 200 ? 0 : 1);
                    })
                    .on("error", (e) => {
                      console.log("::error::Node did not trust the proxy CA: " + e.message);
                      process.exit(1);
                    });
                '

      - name: Verify no CA file was left on the host
        if: always()
        run: |
          for f in /etc/buildcage-ca.pem /dev/buildcage-ca.pem; do
            if [ -e "$f" ]; then
              echo "::error::$f exists on the host after the sandbox steps"
              exit 1
            fi
          done
          echo "OK: no CA file on the host"

      # The hosted image has no NSS database, so every step below makes
      # ~/.pki/nssdb. The short steps must not remove it under the long one.
      - name: Start without an NSS database
        run: rm -rf ~/.pki ~/.local/share/pki "/var/tmp/buildcage-$(id -u)/nssdb-ledger.json"

      - name: sandbox-ephemeral-inspect-home-overlay
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: buildcage-e2e-proxy:inspect
        with:
          proxy_engine: inspect
          filesystem_mode: ephemeral
          label: ephemeral-nssdb
          run: grep -q nssdb /proc/self/mountinfo && test -d ~/.pki/nssdb

      # Made in HOME's overlay, so neither the runner nor the ledger is touched.
      - name: Verify the ephemeral step made nothing on the runner
        id: nssdb-ephemeral
        run: |
          for f in ~/.pki "/var/tmp/buildcage-$(id -u)/nssdb-ledger.json"; do
            if [ -e "$f" ]; then
              echo "::error::$f exists after an ephemeral step"
              exit 1
            fi
          done

      - parallel:
          - name: sandbox-parallel-short-inspect-persistent
            uses: ./
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: buildcage-e2e-proxy:inspect
            with:
              proxy_engine: inspect
              label: parallel-nssdb-short-persistent
              run: "true"

          - name: sandbox-parallel-short-inspect-ephemeral
            uses: ./
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: buildcage-e2e-proxy:inspect
            with:
              proxy_engine: inspect
              filesystem_mode: ephemeral
              label: parallel-nssdb-short-ephemeral
              run: "true"

          - name: sandbox-parallel-long-inspect-chrome
            uses: ./
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: buildcage-e2e-proxy:inspect
            with:
              proxy_engine: inspect
              allowed_url_rules: "GET https://example.com/**"
              label: parallel-nssdb-long
              # Chrome's own background requests are blocked, and are not what this checks.
              fail_on_blocked: false
              run: |
                sleep 15
                if ! grep -q nssdb /proc/self/mountinfo; then
                  echo "::error::the NSS database mount is gone after the concurrent steps ended"
                  exit 1
                fi
                dom=$(google-chrome --headless=new --no-sandbox --dump-dom https://example.com/ 2>/dev/null)
                if ! grep -q "Example Domain" <<<"$dom"; then
                  echo "::error::Chrome did not trust the proxy CA"
                  exit 1
                fi

      # Only once the parallel steps were reached: a failure earlier skips them,
      # and this would then report their missing database instead.
      - name: Verify the NSS database's directories were settled
        if: ${{ !cancelled() && steps.nssdb-ephemeral.outcome == 'success' }}
        run: |
          ledger="/var/tmp/buildcage-$(id -u)/nssdb-ledger.json"
          if [ ! -e "$ledger" ]; then
            echo "::error::$ledger is missing after the persistent steps"
            exit 1
          fi
          cat "$ledger"
          if [ "$(jq -c '[.dirs, .uses]' "$ledger")" != "[{},{}]" ]; then
            echo "::error::$ledger still lists directories or uses after every step ended"
            exit 1
          fi
          if [ ! -e ~/.pki/nssdb/cert9.db ] || grep -rqs buildcage ~/.pki/nssdb; then
            echo "::error::the database Chrome made is missing, or still holds the slot"
            ls -laR ~/.pki || true
            exit 1
          fi
          echo "OK: every step's use ended, and Chrome's database was kept without the slot"

  # Single, stably-named required status check for branch protection: the
  # jobs above vary their own names by matrix entry, so branch protection
  # can't target them directly without listing every combination.
  e2e-tests-passed:
    name: E2E tests passed
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        test_sandbox_audit_mode,
        test_sandbox_filesystem_audit,
        test_sandbox_enforcement,
        test_sandbox_concurrency,
        test_sandbox_concurrency_inspect,
      ]
    if: always()
    permissions: {}
    steps:
      - name: Check whether all required jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
          echo "All required jobs succeeded."
