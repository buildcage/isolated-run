name: Dependency Vulnerability Scan
run-name: Dependency Vulnerability Scan (${{ github.ref_name }})

on:
  schedule:
    # Every Saturday at 00:00 UTC
    - cron: "0 0 * * 6"
  push:
    branches: [main]
    paths: [pnpm-lock.yaml]
  workflow_dispatch:

permissions: {}

jobs:
  # GitHub's dependency graph reads only the first document of pnpm's lockfile,
  # pnpm's own entry, so Dependabot never sees the npm dependencies.
  scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
