name: Example (universal engine, restrict mode)

on:
  workflow_dispatch:

  # Renovate moves the pin below to each new release, so that pull request
  # runs the release through the same path a user's workflow takes: the image
  # pulled by tag and its signature verified.
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/example-universal-restrict.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Renovate sees the release's tag as soon as it is pushed, while
  # docker-publish.yml is still building and signing that tag's images, and
  # the example would fail on an image that is not signed yet.
  release_image:
    runs-on: ubuntu-slim
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Wait for the pinned release's images
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/wait-for-release-image
        with:
          workflow: .github/workflows/example-universal-restrict.yml

  test:
    needs: release_image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      # The audit example's command, with the rules that run produced and one
      # request they block. universal enforces on host and port only, which is
      # as far as it can see without decrypting.
      # fail_on_blocked is false only because this example blocks on purpose;
      # leave it at its default so a real workflow fails on a disallowed destination.
      - name: Run a Maven build with outbound network isolation
        uses: buildcage/isolated-run@e17dbc9c53e03b39835b2f3e11834243d90aa183 # v2.5.0
        with:
          proxy_mode: restrict
          proxy_engine: universal
          allowed_https_rules: |
            repo.maven.apache.org:443
            repository.apache.org:443
          fail_on_blocked: false
          run: |
            mvn -B dependency:get -Dartifact=org.apache.commons:commons-lang3:3.17.0

            # Not on the allowlist, so the report shows it as a blocked host.
            curl -sS --max-time 5 -o /dev/null https://example.com/ || true
