name: Test / Integration
run-name: Test / Integration (${{ github.ref_name }})

on:
  workflow_dispatch:

  # epic/ branches gather a large change before it lands on main.
  pull_request:
    branches:
      - main
      - "epic/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    name: changes
    if: github.event_name == 'pull_request'
    outputs:
      test_sandbox: ${{ steps.filter.outputs.test_sandbox }}
      test_sandbox_universal: ${{ steps.filter.outputs.test_sandbox_universal }}
      test_sandbox_inspect: ${{ steps.filter.outputs.test_sandbox_inspect }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            # Keep in step with what the engine Dockerfiles COPY.
            image: &image
              - 'src/**'
              - 'docker/**'
              - 'compose.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'rolldown.scripts.config.js'
              - '.dockerignore'
            harness: &harness
              - 'rolldown.config.js' # each job builds a test-hook dist
              - 'scripts/**' # run by that dist, from the checkout
              - 'test/**'
              - 'Makefile'
              - '.github/actions/setup-vp/**'
              - '.github/workflows/test-integration.yml'

            test_sandbox:
              - *image
              - *harness
            test_sandbox_universal:
              - *image
              - *harness
              - 'compose.test-universal.yaml'
            test_sandbox_inspect:
              - *image
              - *harness
              - 'compose.test-inspect.yaml'

  # Drives dist/main.cjs directly (see test/integration-test-*.sh), not
  # through the real action; test-e2e.yml's test_sandbox_* jobs keep one
  # representative case each that does exercise the real action.
  test_sandbox:
    needs: changes
    # !cancelled() forces this to evaluate when `changes` is skipped (it runs
    # only on pull_request); a skipped need otherwise skips the job unevaluated.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.test_sandbox == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "integration: test (sandbox)"

    env:
      PROXY_ENGINE: universal

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - name: Build local sandbox proxy image
        run: docker compose build proxy

      - name: Resolve local image ref
        id: local_image
        run: echo "ref=$(docker compose config --images proxy)" >> "$GITHUB_OUTPUT"

      - name: Rebuild the action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: vp run build

      - name: Run integration tests
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
        run: make test_integration_sandbox_linux

  # Three groups side by side, each under its own Compose project and test-net
  # subnet (the names a linked worktree gets): the universal engine's fixture
  # tests, the inspect engine's CA half, and the listener check, which builds
  # its own images and attaches no sandbox. The CA half cannot share a job with
  # the rules half: its cleanup checks wait for every inspect step of the user
  # to end.
  test_sandbox_universal:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.test_sandbox_universal == 'true' || needs.changes.outputs.test_sandbox_inspect == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "integration: test (sandbox, universal engine fixture, inspect CA, listener scope)"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      # compose.yaml names the image the same for either engine, so each build
      # is retagged before the next one overwrites it.
      - name: Build local proxy images for both engines
        run: |
          PROXY_ENGINE=universal docker compose build proxy
          docker tag "$(PROXY_ENGINE=universal docker compose config --images proxy)" buildcage-it-proxy:universal
          PROXY_ENGINE=inspect docker compose build proxy --build-arg BUILDCAGE_TEST_HOOKS=1
          docker tag "$(PROXY_ENGINE=inspect docker compose config --images proxy)" buildcage-it-proxy:inspect

      - name: Rebuild the action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: vp run build

      - parallel:
          - name: Run universal-engine fixture-based integration tests
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: buildcage-it-proxy:universal
              PROXY_ENGINE: universal
              BUILDCAGE_WORKTREE_SUFFIX: -universal
              COMPOSE_PROJECT_NAME: buildcage-test-universal
              TEST_NET_SUBNET: 10.211.0.0/24
            run: make test_integration_sandbox_universal

          - name: Run the inspect engine's CA half
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: buildcage-it-proxy:inspect
              PROXY_ENGINE: inspect
              BUILDCAGE_WORKTREE_SUFFIX: -ca
              COMPOSE_PROJECT_NAME: buildcage-test-inspect-ca
              TEST_NET_SUBNET: 10.212.0.0/24
            run: make test_integration_sandbox_inspect_ca

          - name: Run listener-scope integration tests
            env:
              BUILDCAGE_WORKTREE_SUFFIX: -listener
            run: make test_integration_listener_scope

      - name: Verify no leftover fixture/proxy containers or networks
        if: always()
        run: |
          BUILDCAGE_WORKTREE_SUFFIX=-universal COMPOSE_PROJECT_NAME=buildcage-test-universal \
            docker compose -f compose.test-universal.yaml down -v || true
          BUILDCAGE_WORKTREE_SUFFIX=-ca COMPOSE_PROJECT_NAME=buildcage-test-inspect-ca \
            docker compose -f compose.test-inspect.yaml down -v || true
          LEFTOVER_N=$(docker network ls --filter "name=buildcage-test-" -q)
          if [ -n "$LEFTOVER_N" ]; then
            echo "::error::leftover buildcage-test-* network found"
            exit 1
          fi

  # Separate job from test_sandbox: this one needs an inspect-engine image and
  # fixtures. The CA half runs in test_sandbox_universal.
  test_sandbox_inspect:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.test_sandbox_inspect == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "integration: test (sandbox, inspect engine)"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - name: Build local inspect-engine proxy image (with test hooks)
        env:
          PROXY_ENGINE: inspect
        run: docker compose build proxy --build-arg BUILDCAGE_TEST_HOOKS=1

      - name: Resolve local image ref
        id: local_image
        env:
          PROXY_ENGINE: inspect
        run: echo "ref=$(docker compose config --images proxy)" >> "$GITHUB_OUTPUT"

      - name: Rebuild the action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: vp run build

      # The runner's python3 is older than 3.13, which the Python scenario needs.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Run inspect-engine integration tests
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
        run: make test_integration_sandbox_inspect_rules

      - name: Verify no leftover fixture/proxy containers or networks
        if: always()
        run: |
          docker compose -f compose.test-inspect.yaml down -v || true
          LEFTOVER_N=$(docker network ls --filter "name=buildcage-test-inspect-net" -q)
          if [ -n "$LEFTOVER_N" ]; then
            echo "::error::leftover buildcage-test-inspect-net network found"
            exit 1
          fi

  # Single, stably-named required status check for branch protection.
  integration-tests-passed:
    name: Integration tests passed
    runs-on: ubuntu-latest
    needs: [changes, test_sandbox, test_sandbox_universal, test_sandbox_inspect]
    if: always()
    permissions: {}
    steps:
      - name: Check whether all required jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
          echo "All required jobs succeeded."
