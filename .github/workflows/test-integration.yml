name: Test / Integration
run-name: Test / Integration (${{ github.ref_name }})

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    name: changes
    if: github.event_name == 'pull_request'
    outputs:
      test_sandbox: ${{ steps.filter.outputs.test_sandbox }}
      test_sandbox_universal: ${{ steps.filter.outputs.test_sandbox_universal }}
      test_sandbox_inspect: ${{ steps.filter.outputs.test_sandbox_inspect }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            test_sandbox:
              - 'src/core/**'
              - 'docker/**'
              - 'compose.yaml'
              - 'src/**'
              - 'test/**'
              - 'Makefile'
              - '.github/workflows/test-integration.yml'
            test_sandbox_universal:
              - 'src/core/**'
              - 'docker/**'
              - 'compose.yaml'
              - 'compose.test-universal.yaml'
              - 'src/**'
              - 'test/**'
              - 'Makefile'
              - '.github/workflows/test-integration.yml'
            test_sandbox_inspect:
              - 'src/core/**'
              - 'docker/**'
              - 'compose.yaml'
              - 'compose.test-inspect.yaml'
              - 'src/**'
              - 'test/**'
              - 'Makefile'
              - '.github/workflows/test-integration.yml'

  # Drives dist/main.cjs directly (see test/integration-test-*.sh), not
  # through the real action — test-e2e.yml's test_sandbox_* jobs keep one
  # representative case each that does exercise the real action.
  test_sandbox:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test_sandbox == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "integration: test (sandbox)"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - name: Build local sandbox proxy image
        run: docker compose build proxy

      - name: Resolve local image ref
        id: local_image
        run: echo "ref=$(docker compose config --images proxy)" >> "$GITHUB_OUTPUT"

      - name: Rebuild the action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: vp run build

      - name: Run integration tests
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
        run: make test_integration_sandbox_linux

  # Separate job from test_sandbox: brings up the fixture origin network in
  # compose.test-universal.yaml (fake DNS + an origin under our own control)
  # instead of the real internet, covering cases real hosts can't -- an
  # allowlisted name resolving to an internal address, NXDOMAIN, etc. Same
  # proxy image build as test_sandbox (universal needs no test-hooks build
  # arg, unlike inspect below).
  test_sandbox_universal:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test_sandbox_universal == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "integration: test (sandbox, universal engine fixture)"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - name: Build local sandbox proxy image
        run: docker compose build proxy

      - name: Resolve local image ref
        id: local_image
        run: echo "ref=$(docker compose config --images proxy)" >> "$GITHUB_OUTPUT"

      - name: Rebuild the action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: vp run build

      - name: Run universal-engine fixture-based integration tests
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
        run: make test_integration_sandbox_universal

      - name: Verify no leftover fixture/proxy containers or networks
        if: always()
        run: |
          docker compose -f compose.test-universal.yaml down -v || true
          LEFTOVER_N=$(docker network ls --filter "name=buildcage-test-universal-net" -q)
          if [ -n "$LEFTOVER_N" ]; then
            echo "::error::leftover buildcage-test-universal-net network found"
            exit 1
          fi

  # Separate job from test_sandbox: needs its own (inspect-engine) image build
  # and the fixture origin network in compose.test-inspect.yaml, which the
  # universal-engine tests above have no reason to know about.
  test_sandbox_inspect:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test_sandbox_inspect == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "integration: test (sandbox, inspect engine)"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - name: Build local inspect-engine proxy image (with test hooks)
        env:
          PROXY_ENGINE: inspect
        run: docker compose build proxy --build-arg BUILDCAGE_TEST_HOOKS=1

      - name: Resolve local image ref
        id: local_image
        env:
          PROXY_ENGINE: inspect
        run: echo "ref=$(docker compose config --images proxy)" >> "$GITHUB_OUTPUT"

      - name: Rebuild the action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: vp run build

      - name: Run inspect-engine integration tests
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
        run: make test_integration_sandbox_inspect

      - name: Verify no leftover fixture/proxy containers or networks
        if: always()
        run: |
          docker compose -f compose.test-inspect.yaml down -v || true
          LEFTOVER_N=$(docker network ls --filter "name=buildcage-test-inspect-net" -q)
          if [ -n "$LEFTOVER_N" ]; then
            echo "::error::leftover buildcage-test-inspect-net network found"
            exit 1
          fi

  # Single, stably-named required status check for branch protection.
  integration-tests-passed:
    name: Integration tests passed
    runs-on: ubuntu-latest
    needs: [changes, test_sandbox, test_sandbox_universal, test_sandbox_inspect]
    if: always()
    permissions: {}
    steps:
      - name: Check whether all required jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
          echo "All required jobs succeeded."
