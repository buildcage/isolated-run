name: Test / Integration
run-name: Test / Integration (${{ github.ref_name }})

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    name: changes
    if: github.event_name == 'pull_request'
    outputs:
      test_sandbox: ${{ steps.filter.outputs.test_sandbox }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            test_sandbox:
              - 'src/core/**'
              - 'docker/**'
              - 'compose.yaml'
              - 'src/**'
              - 'test/**'
              - 'Makefile'
              - '.github/workflows/test-integration.yml'

  # Drives dist/main.cjs directly (see test/integration-test-*.sh), not
  # through the real action — test-e2e.yml's test_sandbox_* jobs keep one
  # representative case each that does exercise the real action.
  test_sandbox:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test_sandbox == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "integration: test (sandbox)"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - name: Build local sandbox proxy image
        run: docker compose build proxy

      - name: Resolve local image ref
        id: local_image
        run: echo "ref=$(docker compose config --images proxy)" >> "$GITHUB_OUTPUT"

      - name: Rebuild the action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: vp run build

      - name: Run integration tests
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
        run: make test_integration_sandbox_linux

  # Single, stably-named required status check for branch protection.
  integration-tests-passed:
    name: Integration tests passed
    runs-on: ubuntu-latest
    needs: [changes, test_sandbox]
    if: always()
    permissions: {}
    steps:
      - name: Check whether all required jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
          echo "All required jobs succeeded."
