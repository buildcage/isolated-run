name: Example (AWS access key check, restrict mode)

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    # The role trusts only jobs in this environment, whose runs a maintainer approves.
    environment: aws-example
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the role's keys through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # Same command as the audit example, with the rules that run produced and
      # the account it marked for checking, kept in a repository variable. The
      # compromised dependency's call is refused even though the URL rule allows
      # its host. fail_on_blocked is false only because this example blocks on
      # purpose; leave it at its default so a real workflow fails on a refusal.
      - name: Call AWS with outbound network isolation
        uses: buildcage/isolated-run@4533b0b5f31b7084de488a0d7a46b8917afcbb4d # v2.2.0-rc4
        env:
          SWITCHED_ROLE_ARN: ${{ vars.AWS_SWITCHED_ROLE_ARN }}
        with:
          proxy_mode: restrict
          allowed_url_rules: |
            POST https://sts.us-east-1.amazonaws.com/
          aws_key_check: true
          allowed_aws_role_accounts: ${{ vars.AWS_SWITCHED_ACCOUNT_ID }}
          fail_on_blocked: false
          run: .github/examples/aws-key-check/deploy.sh
