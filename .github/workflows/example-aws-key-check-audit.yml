name: Example (AWS access key check, audit mode)

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    # The role trusts only jobs in this environment, whose runs a maintainer approves.
    environment: aws-example
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the role's keys through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # No account is named yet, so the report's "Restrict Would Block" counts
      # the call signed with the switched role's key as well as the compromised
      # dependency's, and its "Switch to restrict mode" example returns the URL
      # rules, aws_key_check and the switched role's account, commented out
      # with the key it lets through for you to check it is yours. No STS
      # answer issued the dependency's key, so no account lets it through.
      - name: Discover required URLs and accounts with isolated-run
        uses: buildcage/isolated-run@4533b0b5f31b7084de488a0d7a46b8917afcbb4d # v2.2.0-rc4
        env:
          SWITCHED_ROLE_ARN: ${{ vars.AWS_SWITCHED_ROLE_ARN }}
        with:
          proxy_mode: audit
          aws_key_check: true
          run: .github/examples/aws-key-check/deploy.sh
