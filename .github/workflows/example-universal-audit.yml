name: Example (universal engine, audit mode)

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # universal reads the SNI without decrypting, so the command needs no
      # injected CA. audit records every destination, and the Job Summary's
      # "Switch to restrict mode" section lists them as allowed-https-rules.
      - name: Discover required domains with isolated-run
        uses: buildcage/isolated-run@e3f3c86aa4cfd6ebaa7f538cd91ced0a6d1674f3 # v2.6.0
        with:
          proxy-mode: audit
          proxy-engine: universal
          run: |
            mvn -B dependency:get -Dartifact=org.apache.commons:commons-lang3:3.17.0
