name: Example (inspect engine, audit mode)

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # inspect decrypts, so it logs each request's method and full URL, and
      # the Job Summary's "Switch to restrict mode" section lists them as
      # allowed-url-rules.
      - name: Discover required URLs with isolated-run
        uses: buildcage/isolated-run@6e4a23d9fadd854988f3e498cd6570bcaa608716 # v2.6.1
        with:
          proxy-mode: audit
          proxy-engine: inspect
          run: |
            npm init -y
            npm install --ignore-scripts @hono/node-server
