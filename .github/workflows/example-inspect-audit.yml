name: Example (inspect engine, audit mode)

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # The inspect engine terminates TLS, so it records the method and the
      # full URL of every request. The Job Summary's "Switch to restrict mode"
      # section returns them as allowed_url_rules rather than a list of hosts.
      - name: Discover required URLs with isolated-run
        uses: buildcage/isolated-run@eb076226d15bbadefb7545dc1e02c05ff9f09ae5 # v1.1.3
        with:
          proxy_mode: audit
          proxy_engine: inspect
          run: |
            npm init -y
            npm install --ignore-scripts express

            # A second registry, and one that needs two domains: the index and
            # the files it points at.
            python3 -m pip install --user --quiet requests

            # Nothing here needs this. audit records it like any other request,
            # so leave it out of the rules you paste back in.
            curl -sS --max-time 5 -o /dev/null https://example.com/ || true
