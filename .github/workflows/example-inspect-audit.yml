name: Example (inspect engine, audit mode)

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # inspect decrypts, so it logs each request's method and full URL, and
      # the Job Summary's "Switch to restrict mode" section returns allowed_url_rules.
      - name: Discover required URLs with isolated-run
        uses: buildcage/isolated-run@086f49946425ef5e6ccf0bd251e79671009d1392 # v2.1.0
        with:
          proxy_mode: audit
          proxy_engine: inspect
          run: |
            npm init -y
            npm install --ignore-scripts @hono/node-server
