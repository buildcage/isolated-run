name: Example (filesystem audit)

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # A committed sample, staged at the workspace root before the audited step
      # so npm ci reads an existing package.json and lockfile rather than probes
      # for and creates them. Staging at the root rather than running from its
      # own directory keeps the recorded paths workspace-relative, since the
      # audit shows them under $GITHUB_WORKSPACE whatever the working directory.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: test/filesystem-audit
          sparse-checkout-cone-mode: false
      - name: Stage the sample project
        run: cp test/filesystem-audit/package.json test/filesystem-audit/package-lock.json .

      # The Job Summary's "Filesystem Activity" section lists the programs the
      # install ran and every path it touched. The rules are the inspect
      # restrict example's, since this example is about the filesystem.
      - name: Record what an install touches
        id: sandboxed
        uses: buildcage/isolated-run@982ef9f5462477eedc29a8f94dcaef669a2bdccd # v2.3.0
        with:
          proxy_mode: restrict
          allowed_url_rules: |
            GET https://registry.npmjs.org/**
            POST https://registry.npmjs.org/-/npm/v1/security/advisories/bulk
          filesystem_audit: record
          upload_filesystem_audit_artifact: true
          run: |
            npm ci

            # Recorded as a refused write (w!): the sandbox makes /usr/local/bin read-only.
            touch /usr/local/bin/buildcage-example-planted || true

      # Empty when nothing was uploaded, and download-artifact would then fetch
      # every artifact of the run.
      - name: Download the full record
        if: steps.sandboxed.outputs.filesystem_audit_artifact_name != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.sandboxed.outputs.filesystem_audit_artifact_name }}
          path: filesystem-audit

      - name: Show the first entries of the record
        run: find filesystem-audit -type f -exec head -n 5 {} +
