name: Example (filesystem audit with expected rules)

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # The same sample and install as the filesystem audit example, whose
      # run the baseline was taken from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: test/filesystem-audit
          sparse-checkout-cone-mode: false
      - name: Stage the sample project
        run: cp test/filesystem-audit/package.json test/filesystem-audit/package-lock.json .

      # The config file holds the baseline. The Job Summary's "Filesystem
      # Activity Report" section then lists only the accesses outside it, under
      # Unexpected Accesses: here the write to /usr/local/bin, which the
      # baseline leaves out as a stand-in for an install script planting a
      # file. With fail_on_unexpected_file_access: true, that would fail the
      # step.
      - name: Check what an install touches against a baseline
        uses: buildcage/isolated-run@b3c6b5415d1ce2dc9cd3e580b8dac8962a17c9d2 # v2.4.0
        with:
          proxy_mode: restrict
          allowed_url_rules: |
            GET https://registry.npmjs.org/**
            POST https://registry.npmjs.org/-/npm/v1/security/advisories/bulk
          filesystem_audit: record
          # Proposes a rule for each access outside the baseline, to review and
          # add once it is expected.
          upload_filesystem_audit_artifact: true
          config_file: test/filesystem-audit/expected-filesystem-rules.yml
          run: |
            npm ci

            # Not in the baseline: an unexpected refused write (w!a).
            touch /usr/local/bin/buildcage-example-planted || true
