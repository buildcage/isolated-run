name: Example (inspect engine, restrict mode)

on:
  workflow_dispatch:

  # Renovate moves the pin below to each new release, so that pull request
  # runs the release through the same path a user's workflow takes: the image
  # pulled by tag and its signature verified.
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/example-inspect-restrict.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Renovate sees the release's tag as soon as it is pushed, while
  # docker-publish.yml is still building and signing that tag's images, and
  # the example would fail on an image that is not signed yet.
  release_image:
    runs-on: ubuntu-slim
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Wait for the pinned release's images
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/wait-for-release-image
        with:
          workflow: .github/workflows/example-inspect-restrict.yml

  test:
    needs: release_image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      # The audit example's command, with the rules that run produced and one
      # request they block. The rules name methods too, so an npm publish (a
      # PUT) would be blocked as well.
      # fail_on_blocked is false only because this example blocks on purpose;
      # leave it at its default so a real workflow fails on a disallowed request.
      - name: Install dependencies with outbound network isolation
        uses: buildcage/isolated-run@7231a9514976bc228a07871b58a87aa99af442a1 # v2.4.1
        with:
          proxy_mode: restrict
          proxy_engine: inspect
          allowed_url_rules: |
            GET https://registry.npmjs.org/**
            POST https://registry.npmjs.org/-/npm/v1/security/advisories/bulk
          fail_on_blocked: false
          run: |
            npm init -y
            npm install --ignore-scripts @hono/node-server

            # Blocked: the report names the full URL, not just the host.
            curl -sS --max-time 5 -o /dev/null https://example.com/ || true
