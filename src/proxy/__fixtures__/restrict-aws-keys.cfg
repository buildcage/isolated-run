    # that needs the request buffer (the SNI capture and resolution above).
    # Separate rules: while a ClientHello is incomplete the first one waits
    # for the rest, where an `||` would accept on its first segment.
    tcp-request content accept if { req.ssl_hello_type 1 }
    tcp-request content accept if { req.len gt 0 }

    acl is_tls req.ssl_hello_type 1
    use_backend to_tls if is_tls
    default_backend to_plain

backend passthrough
    mode tcp
    server origin 0.0.0.0

backend to_tls
    mode tcp
    server s 127.0.0.1:10025 send-proxy-v2

backend to_plain
    mode tcp
    server s 127.0.0.1:10026 send-proxy-v2

frontend https_in
    bind 127.0.0.1:10025 accept-proxy ssl crt /etc/haproxy/default.pem generate-certificates ca-sign-file /etc/haproxy/ca.pem
