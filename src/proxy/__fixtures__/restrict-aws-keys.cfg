    log-format "buildcage %[date(0,ms)] http %HM %ST %B ts=%ts reason=%[var(txn.reason)] tlserr=%[ssl_bc_err] dst=%[dst]:%[dst_port] wr=%[var(txn.would_refuse),regsub([^A-Za-z0-9._-],_,g)] host=%[var(txn.host_log)] %[var(txn.pathq)]"

    # s3.amazonaws.com:80
    acl p0_host var(txn.host) -m str s3.amazonaws.com
    acl p0_port dst_port 80
    acl p0_path path -m beg /

    http-request set-var(txn.allowed) bool(false)
    http-request set-var(txn.allowed) bool(true) if !{ var(txn.allowed) -m bool } p0_host p0_port p0_path
