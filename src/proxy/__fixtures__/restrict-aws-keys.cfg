    acl aws_host var(txn.aws_host) -m bool
    acl aws_sts_host var(txn.host) -m reg ^sts(-fips)?(\.[a-z0-9-]+)?\.(amazonaws\.com|amazonaws\.com\.cn|amazonaws\.eu|api\.aws|api\.amazonwebservices\.com\.cn|api\.amazonwebservices\.eu)$|^([a-z0-9-]+\.)*vpce-[a-z0-9-]+\.sts\.[a-z0-9-]+\.vpce\.amazonaws\.com$
    acl aws_resource_host var(txn.host) -m reg (^|\.)s3(-[a-z0-9-]+)?(\.[a-z0-9-]+)*\.amazonaws\.(com|com\.cn|eu)$|\.(dkr\.ecr|d\.codeartifact|execute-api|appsync-api|appsync-realtime-api)\.[a-z0-9-]+\.amazonaws\.(com|com\.cn|eu)$|\.elb(\.[a-z0-9-]+)?\.amazonaws\.(com|com\.cn|eu)$|\.compute(-1)?\.amazonaws\.(com|com\.cn|eu)$|^awscli\.amazonaws\.com$
    # Only AWS's own schemes are a credential here: CodeArtifact and ECR take
    # Bearer and Basic tokens, which no AWS account signs with. Any case, so a
    # spelling AWS might accept is never let through unjudged.
    acl aws_auth req.fhdr(authorization) -m reg -i ^aws
    acl aws_auth_many req.fhdr_cnt(authorization) gt 1
    acl aws_auth_many req.fhdr(authorization) -m reg -i credential=.*credential=
    # Decoded first: a name spelled as X-Amz-Cr%65dential still counts.
    acl aws_query query,url_dec -m reg -i (^|&)(x-amz-credential|awsaccesskeyid)=
    acl aws_query_many query,url_dec -m reg -i (?s)(^|&)(x-amz-credential|awsaccesskeyid)=.*&(x-amz-credential|awsaccesskeyid)=
    # SigV2 also takes its parameters from a form body, and a key there is
    # judged alongside one in the header or the query. A body counts as a
    # form by its Content-Type or, whatever that says, by starting as one.
    # Hosts that name a resource are left out.
    http-request set-var(txn.aws_post) bool(true) if aws_host METH_POST !aws_resource_host
    acl aws_post var(txn.aws_post) -m bool
    http-request wait-for-body time 30s if aws_post
    http-request set-var(txn.aws_form_post) bool(true) if aws_post { req.hdr(content-type) -m beg -i application/x-www-form-urlencoded } or aws_post { req.body -m reg ^&*[A-Za-z0-9._~%*+!(),:/@-]*= }
    acl aws_form_post var(txn.aws_form_post) -m bool
    http-request wait-for-body time 30s use-large-buffer if aws_form_post
    # Matched undecoded, since a value carries & and = encoded, but each
    # letter of the name may be.
    http-request set-var(txn.aws_body) bool(true) if aws_form_post { req.body -m reg -i (^|&)(a|%61|%41)(w|%77|%57)(s|%73|%53)(a|%61|%41)(c|%63|%43)(c|%63|%43)(e|%65|%45)(s|%73|%53)(s|%73|%53)(k|%6b|%4b)(e|%65|%45)(y|%79|%59)(i|%69|%49)(d|%64|%44)= }
    acl aws_body var(txn.aws_body) -m bool
    acl aws_body_many req.body -m reg -i (?s)(^|&)(a|%61|%41)(w|%77|%57)(s|%73|%53)(a|%61|%41)(c|%63|%43)(c|%63|%43)(e|%65|%45)(s|%73|%53)(s|%73|%53)(k|%6b|%4b)(e|%65|%45)(y|%79|%59)(i|%69|%49)(d|%64|%44)=.*&(a|%61|%41)(w|%77|%57)(s|%73|%53)(a|%61|%41)(c|%63|%43)(c|%63|%43)(e|%65|%45)(s|%73|%53)(s|%73|%53)(k|%6b|%4b)(e|%65|%45)(y|%79|%59)(i|%69|%49)(d|%64|%44)=
    http-request set-var(txn.aws_body_key) req.body_param(AWSAccessKeyId,i) if aws_body
    # A header neither pattern matches comes out unchanged, and so never
    # equals a key in the map.
    http-request set-var(txn.aws_key) 'req.fhdr(authorization),regsub("^AWS4-[A-Z0-9-]+ +Credential=([A-Za-z0-9]+)/.*$","\1",i),regsub("^AWS ([A-Za-z0-9]+):.*$","\1",i)' if aws_host aws_auth !aws_query
    http-request set-var(txn.aws_key) 'url_param(X-Amz-Credential),url_dec,regsub("^([A-Za-z0-9]+)/.*$","\1")' if aws_host aws_query !aws_auth { url_param(X-Amz-Credential) -m found }
    http-request set-var(txn.aws_key) url_param(AWSAccessKeyId) if aws_host aws_query !aws_auth { url_param(AWSAccessKeyId) -m found }
    http-request set-var(txn.aws_key) var(txn.aws_body_key) if aws_body !aws_auth !aws_query
    http-request set-var(txn.aws) str(ambiguous-credential) if aws_host aws_auth aws_query or aws_host aws_auth aws_auth_many or aws_host aws_query_many or aws_body aws_body_many
    # Unsigned, whatever the method: where the host names no resource, the
    # account it reaches is in the parameters or the body, out of sight.
    # An S3 POST-policy upload carries its credential in a multipart body,
    # which this does not read, so it counts as unsigned and is refused.
    http-request set-var(txn.aws_form) bool(true) if METH_POST { var(txn.host) -m reg (^|\.)s3(-[a-z0-9-]+)?(\.[a-z0-9-]+)*\.amazonaws\.(com|com\.cn|eu)$ } { req.hdr(content-type) -m beg -i multipart/form-data }
    acl aws_form var(txn.aws_form) -m bool
    http-request set-var(txn.aws) str(unsigned) if aws_host !aws_auth !aws_query !aws_body aws_resource_host !aws_form
    http-request set-var(txn.aws) str(no-credential) if aws_host !aws_auth !aws_query !aws_body !aws_resource_host or aws_host !aws_auth !aws_query !aws_body aws_form
    # Where a credential could be out of sight: a query url_dec cannot decode
    # (%00 or a broken escape), or a form body that is compressed, sent
    # chunked, larger than the buffer, or holds a NUL, where matching stops.
    http-request set-var(txn.aws_body_size) req.body_size if aws_form_post
    http-request set-var(txn.aws_body_len) req.body_len if aws_form_post
    http-request set-var(txn.aws) str(unreadable) if aws_host { query -m found } !{ query,url_dec -m found }
    http-request set-var(txn.aws) str(unreadable) if aws_form_post { req.hdr(content-encoding) -m reg -i ^(?!identity$) } or aws_form_post { req.hdr(transfer-encoding) -m found }
    http-request set-var(txn.aws) str(unreadable) if aws_form_post { req.body_len,sub(txn.aws_body_size) lt 0 } or aws_form_post { req.body,length,sub(txn.aws_body_len) lt 0 }
    # A body key next to another one; a body key alone is aws_key below.
    http-request set-var(txn.aws) str(key-not-allowed) if aws_body aws_auth !{ var(txn.aws) -m found } !{ var(txn.aws_body_key),map(/etc/haproxy/rules/aws_keys.map) -m found } or aws_body aws_query !{ var(txn.aws) -m found } !{ var(txn.aws_body_key),map(/etc/haproxy/rules/aws_keys.map) -m found }
    http-request set-var(txn.aws) str(key-not-allowed) if aws_host !{ var(txn.aws) -m found } !{ var(txn.aws_key),map(/etc/haproxy/rules/aws_keys.map) -m found }
    http-request set-var(txn.aws) str(allowed) if aws_host !{ var(txn.aws) -m found }
    acl aws_refused var(txn.aws) -m str no-credential ambiguous-credential unreadable key-not-allowed
    http-request set-var-fmt(txn.reason) aws-%[var(txn.aws)] if aws_refused
    http-request deny deny_status 403 if aws_refused
    # The body has to be readable to learn a key from it; no Accept-Encoding
    # at all would mean any coding is acceptable (RFC 9110). Left alone where
    # it is signed, which rewriting would break: a compressed answer then
    # teaches nothing, and the key it issues is refused.
    acl aws_coding_signed req.fhdr(authorization) -m reg -i signedheaders=[^,]*accept-encoding
    acl aws_coding_signed query,url_dec -m reg -i (^|&)x-amz-signedheaders=[^&]*accept-encoding
    http-request set-header Accept-Encoding identity if aws_sts_host !aws_coding_signed
    http-request set-var(txn.aws_sts) bool(true) if aws_sts_host

    # Connect to the address this proxy resolves the Host to, discarding
    # the client's address, so a forged Host or doctored /etc/hosts cannot
    # choose the target.
    # txn.host has already dropped the port a header carries, which is not
    # part of the name. An address is taken as-is: no resolver can answer
    # one, and the rules above already decided, so nothing is loosened.
    acl host_is_address var(txn.host) -m reg ^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$
    http-request set-var(txn.dst) var(txn.host) if host_is_address
    http-request do-resolve(txn.dst,buildcage,ipv4) var(txn.host) unless host_is_address
    # A fresh attempt, not a replay: nothing cached the failure.
    http-request do-resolve(txn.dst,buildcage,ipv4) var(txn.host) unless host_is_address or { var(txn.dst) -m found }
    http-request set-var(txn.reason) str(dns-failed) unless { var(txn.dst) -m found }
    http-request deny deny_status 502 unless { var(txn.dst) -m found }

    # Set before the internal-destination check below, not after: %[dst] in
    # the log-format is this, and a refusal must show the address that
    # tripped it, not whatever the client's own (fake, unresolved) address
    # was: CoreDNS never hands out a real one; see coredns-config.ts.
    http-request set-dst var(txn.dst)

    # A resolved destination may not be internal; see INTERNAL_RANGES.
    acl dst_internal var(txn.dst) -m ip 0.0.0.0/8 127.0.0.0/8 169.254.0.0/16 100.64.0.0/10 192.0.0.0/24 168.63.129.16/32 ::1/128 fe80::/10 198.19.255.0/24 198.19.255.1
    http-request set-var(txn.reason) str(internal-address) if dst_internal
    http-request deny deny_status 403 if dst_internal

    default_backend origin_plain

# The only place a request reaches the origin, so where its certificate is
# checked; a refused request never gets here. The SNI is the port-free
# txn.host the rules judged, since a certificate is verified against a name,
# not a name and port.
backend origin_tls
    mode http
    server origin 0.0.0.0 ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt sni var(txn.host)

backend origin_plain
    mode http
    server origin 0.0.0.0
