    http-request set-var(txn.aws_resource_host) bool(true) if aws_host { var(txn.host) -m reg (^|\.)s3(-[a-z0-9-]+)?(\.[a-z0-9-]+)*\.amazonaws\.(com|com\.cn|eu)$|\.(dkr\.ecr(-fips)?|d\.codeartifact|execute-api|appsync-api|appsync-realtime-api)\.[a-z0-9-]+\.amazonaws\.(com|com\.cn|eu)$|^g-[a-z0-9]+\.grafana-workspace\.[a-z0-9-]+\.amazonaws\.(com|com\.cn|eu)$|^b-[a-z0-9-]+\.mq\.[a-z0-9-]+\.amazonaws\.(com|com\.cn|eu)$|^(search|vpc)-[a-z0-9-]+\.[a-z0-9-]+\.es\.amazonaws\.(com|com\.cn|eu)$|^[0-9a-f]{32}\.[a-z0-9]+\.[a-z0-9-]+\.eks\.amazonaws\.(com|com\.cn|eu)$|^[0-9a-f]{32}\.[a-z0-9-]+\.(api\.aws|api\.amazonwebservices\.com\.cn|api\.amazonwebservices\.eu)$|^oidc\.eks\.[a-z0-9-]+\.amazonaws\.(com|com\.cn|eu)$|^oidc-eks\.[a-z0-9-]+\.(api\.aws|api\.amazonwebservices\.com\.cn|api\.amazonwebservices\.eu)$|\.elb(\.[a-z0-9-]+)?\.amazonaws\.(com|com\.cn|eu)$|\.compute(-1)?\.amazonaws\.(com|com\.cn|eu)$ }
