    http-request set-var(txn.aws_query) bool(true) if aws_host { query -m reg -i (^|&)(x|%78|%58)(-|%2d)(a|%61|%41)(m|%6d|%4d)(z|%7a|%5a)(-|%2d)(c|%63|%43)(r|%72|%52)(e|%65|%45)(d|%64|%44)(e|%65|%45)(n|%6e|%4e)(t|%74|%54)(i|%69|%49)(a|%61|%41)(l|%6c|%4c)= }
    acl aws_query var(txn.aws_query) -m bool
    acl aws_query_many query -m reg -i (^|&)(x|%78|%58)(-|%2d)(a|%61|%41)(m|%6d|%4d)(z|%7a|%5a)(-|%2d)(c|%63|%43)(r|%72|%52)(e|%65|%45)(d|%64|%44)(e|%65|%45)(n|%6e|%4e)(t|%74|%54)(i|%69|%49)(a|%61|%41)(l|%6c|%4c)=.*&(x|%78|%58)(-|%2d)(a|%61|%41)(m|%6d|%4d)(z|%7a|%5a)(-|%2d)(c|%63|%43)(r|%72|%52)(e|%65|%45)(d|%64|%44)(e|%65|%45)(n|%6e|%4e)(t|%74|%54)(i|%69|%49)(a|%61|%41)(l|%6c|%4c)=
