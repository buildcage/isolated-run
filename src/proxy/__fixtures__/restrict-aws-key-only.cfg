    error-log-format "buildcage %[date(0,ms)] https %HM %ST %B ts=%ts reason=%[var(txn.reason)] tlserr=%[ssl_bc_err] dst=%[dst]:%[dst_port] wr=%[var(txn.would_refuse),regsub([^A-Za-z0-9._-],_,g)] aws.key=%[var(txn.aws_log_key),regsub([^A-Za-z0-9._-],_,g)] aws.accountId=%[var(txn.aws_log_account),regsub([^A-Za-z0-9._-],_,g)] aws.assumedAccount=%[var(txn.aws_log_assumed),regsub([^A-Za-z0-9._-],_,g)] fcerr=%[fc_err_name] sni=%[ssl_fc_sni,regsub([^A-Za-z0-9._-],_,g)] host=%[var(txn.host_log)] %[var(txn.pathq)]"

