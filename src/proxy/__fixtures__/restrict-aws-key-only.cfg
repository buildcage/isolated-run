    # names its account, <user>-at-<id>; either way the repository is looked
    # up in that account.
    http-request set-var(txn.aws_git_host) bool(true) if aws_host { var(txn.host) -m reg ^git-codecommit(-fips)?\.[a-z0-9-]+\.amazonaws\.(com|com\.cn|eu)$|^([a-z0-9-]+\.)*vpce-[a-z0-9-]+\.git-codecommit(-fips)?\.[a-z0-9-]+\.vpce\.amazonaws\.com$ }
