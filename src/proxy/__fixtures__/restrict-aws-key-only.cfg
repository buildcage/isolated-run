    http-request set-var(txn.aws_sigv4) bool(true) if aws_host { req.fhdr(authorization) -m reg ^AWS4-(HMAC-SHA256|ECDSA-P256-SHA256)\s+Credential=[A-Za-z0-9]+/ }
