# The baseline for example-filesystem-audit-expected.yml: the rules a
# filesystem audit example run proposed, with the paths that change between
# runs (a log's timestamp, node's version) widened to `**`.
expected_filesystem_rules: |
  bash                                            rw   /dev/tty
  bash                                            R    /etc/locale.alias
  bash                                            X    /usr/bin/touch
  bash                                            R    /usr/lib/locale/**
  bash                                            R    /usr/lib/x86_64-linux-gnu/gconv/gconv-modules.cache
  bash                                            X    /usr/local/lib/node_modules/npm/bin/npm-cli.js
  /usr/bin/touch                                  R    /etc/locale.alias
  /usr/bin/touch                                  R    /usr/lib/locale/**
  /usr/bin/touch                                  R    /usr/lib/x86_64-linux-gnu/gconv/gconv-modules.cache
  /usr/local/lib/node_modules/npm/bin/npm-cli.js  R    /etc/locale.alias
  /usr/local/lib/node_modules/npm/bin/npm-cli.js  R    /usr/lib/locale/**
  /usr/local/lib/node_modules/npm/bin/npm-cli.js  R    /usr/lib/x86_64-linux-gnu/gconv/gconv-modules.cache
  /usr/local/lib/node_modules/npm/bin/npm-cli.js  X    /usr/local/bin/node
  /usr/local/bin/node                             r    ./.npmrc
  /usr/local/bin/node                             RW   ./node_modules/**
  /usr/local/bin/node                             r    ./npm-shrinkwrap.json
  /usr/local/bin/node                             R    ./package-lock.json
  /usr/local/bin/node                             R    ./package.json
  /usr/local/bin/node                             r    ./yarn.lock
  /usr/local/bin/node                             W    ~/.npm
  /usr/local/bin/node                             WMr  ~/.npm/_cacache/**
  /usr/local/bin/node                             RW   ~/.npm/_logs
  /usr/local/bin/node                             W    ~/.npm/_logs/**
  /usr/local/bin/node                             r    ~/.npmrc
  /usr/local/bin/node                             R    /dev/buildcage-ca.pem
  /usr/local/bin/node                             R    /etc/host.conf
  /usr/local/bin/node                             R    /etc/hosts
  /usr/local/bin/node                             r    /etc/netsvc.conf
  /usr/local/bin/node                             R    /etc/nsswitch.conf
  /usr/local/bin/node                             R    /etc/ssl/openssl.cnf
  /usr/local/bin/node                             r    /etc/svc.conf
  /usr/local/bin/node                             R    /proc/meminfo
  /usr/local/bin/node                             R    /proc/self/cgroup
  /usr/local/bin/node                             R    /proc/self/maps
  /usr/local/bin/node                             R    /proc/sys/vm/overcommit_memory
  /usr/local/bin/node                             R    /proc/version_signature
  /usr/local/bin/node                             R    /run/systemd/resolve/stub-resolv.conf
  /usr/local/bin/node                             R    /sys/devices/system/cpu/online
  /usr/local/bin/node                             R    /sys/fs/cgroup/**
  /usr/local/bin/node                             W    /tmp/node-compile-cache
  /usr/local/bin/node                             WMr  /tmp/node-compile-cache/**
  /usr/local/bin/node                             R    /usr/**
