# Upstream resolver for the universal engine's HAProxy, reached through
# Docker's embedded DNS once a request has already passed the rules.
address=/allowed.example.com/10.200.0.100
address=/blocked.example.com/10.200.0.100
address=/wildcard.example.com/10.200.0.100
# Hosts for the `~` regex rules in test/integration-test-universal-restrict.sh.
address=/regex.example.com/10.200.0.100
# Two interchangeable names for test/integration-test-concurrent.sh, where each
# instance needs an allowlisted host the other instance's rules do not cover.
address=/concurrent-a.example.com/10.200.0.100
address=/concurrent-b.example.com/10.200.0.100
# Return NXDOMAIN for this domain (no IP = NXDOMAIN in dnsmasq 2.86+). More
# specific than the wildcard.example.com rule above, so it takes precedence.
address=/nxdomain.wildcard.example.com/
# AAAA only. An `address=` line carrying just an IPv6 would leave A falling
# through to the broader wildcard.example.com entry above.
local=/v6only.wildcard.example.com/
host-record=v6only.wildcard.example.com,2001:db8::1
# Allowlisted name resolving to a link-local address (AWS/GCP/Azure IMDS).
address=/internal.wildcard.example.com/169.254.169.254
# Allowlisted name resolving to a runner address (HOST_ADDRESSES in
# docker/compose.action.test-universal.yaml). RFC1918 is allowed, so only that
# list refuses it.
address=/runner.wildcard.example.com/10.200.0.199

# Nothing leaves this fixture. Every name the rules let HAProxy resolve is
# defined above, so an unknown one is a scenario's typo, and answering it from
# the real internet would settle a test for reasons this suite does not own.
# no-resolv keeps dnsmasq off the container's own resolv.conf, which Docker
# points at its embedded forwarder. address=/#/ then answers whatever is left
# NXDOMAIN: an upstream-less dnsmasq without it returns REFUSED to every query
# it cannot answer locally, AAAA for the names above included.
no-resolv
address=/#/
