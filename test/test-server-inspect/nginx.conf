events {
    worker_connections 128;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr;

    # The body names the path class and echoes the method, so a test can tell
    # which resource actually answered. Path rules are only meaningful against
    # a server that distinguishes paths: with a uniform response, a request
    # that walked out of /public/ would look identical to one that did not.
    map $uri $body_class {
        ~^/public/   PUBLIC;
        ~^/private/  PRIVATE;
        ~^/v1/       API;
        default      ROOT;
    }

    server {
        # 9080 is deliberately non-standard: nothing declares it as plaintext,
        # so reaching it proves the listener classifies by content and that the
        # original port survives to the origin connection.
        listen 80;
        listen 8080;
        listen 9080;
        location / { return 200 "$body_class $request_method $uri\n"; }
    }

    server {
        # 9443 is non-standard for the same reason, on the TLS side.
        listen 443 ssl;
        listen 8443 ssl;
        listen 9443 ssl;
        ssl_certificate     /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;
        location / { return 200 "$body_class $request_method $uri\n"; }

        # STS AssumeRole answers, shaped like the API reference's sample, for
        # a role in the allowed account and for one in another account.
        # The key ID is split across a variable: a literal shaped like an AWS
        # access key ID trips secret scanning on push.
        location = /sts/same-account {
            default_type text/xml;
            set $asia AS;
            return 200 '<AssumeRoleResponse xmlns="https://sts.amazonaws.com/doc/2011-06-15/"><AssumeRoleResult><AssumedRoleUser><Arn>arn:aws:sts::111111111111:assumed-role/deploy/s</Arn><AssumedRoleId>AROATEST:s</AssumedRoleId></AssumedRoleUser><Credentials><SessionToken>TOKEN</SessionToken><SecretAccessKey>SECRET</SecretAccessKey><Expiration>2099-01-01T00:00:00Z</Expiration><AccessKeyId>${asia}IATESTLEARNEDKEY01</AccessKeyId></Credentials></AssumeRoleResult></AssumeRoleResponse>\n';
        }
        location = /sts/web-identity {
            default_type text/xml;
            set $asia AS;
            return 200 '<AssumeRoleWithWebIdentityResponse xmlns="https://sts.amazonaws.com/doc/2011-06-15/"><AssumeRoleWithWebIdentityResult><SubjectFromWebIdentityToken>repo:o/r:ref:refs/heads/main</SubjectFromWebIdentityToken><Audience>sts.amazonaws.com</Audience><AssumedRoleUser><Arn>arn:aws:sts::111111111111:assumed-role/deploy/gh</Arn><AssumedRoleId>AROATEST:gh</AssumedRoleId></AssumedRoleUser><Credentials><SessionToken>TOKEN</SessionToken><SecretAccessKey>SECRET</SecretAccessKey><Expiration>2099-01-01T00:00:00Z</Expiration><AccessKeyId>${asia}IATESTWEBIDKEY0001</AccessKeyId></Credentials><Provider>https://token.actions.githubusercontent.com</Provider></AssumeRoleWithWebIdentityResult></AssumeRoleWithWebIdentityResponse>\n';
        }
        # An ECR registry's answer to a layer download: a redirect to a
        # presigned URL signed with a key of the registry's own.
        location ^~ /v2/app/blobs/sha256: {
            set $asia AS;
            return 307 'https://prod-us-east-1-starport-layer-bucket.s3.amazonaws.com/layer?X-Amz-Security-Token=T&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=${asia}IATESTISSUEDKEY01%2F20261010%2Fus-east-1%2Fs3%2Faws4_request&X-Amz-Signature=ab';
        }
        location = /sts/other-account {
            default_type text/xml;
            set $asia AS;
            return 200 '<AssumeRoleResponse xmlns="https://sts.amazonaws.com/doc/2011-06-15/"><AssumeRoleResult><AssumedRoleUser><Arn>arn:aws:sts::999999999999:assumed-role/evil/s</Arn><AssumedRoleId>AROATEST:s</AssumedRoleId></AssumedRoleUser><Credentials><SessionToken>TOKEN</SessionToken><SecretAccessKey>SECRET</SecretAccessKey><Expiration>2099-01-01T00:00:00Z</Expiration><AccessKeyId>${asia}IATESTFOREIGNKEY01</AccessKeyId></Credentials></AssumeRoleResult></AssumeRoleResponse>\n';
        }
    }
}

# A server that speaks first, as SMTP or MySQL does, for a passthrough the
# client sends nothing on.
stream {
    server {
        listen 2525;
        return "220 buildcage-test\r\n";
    }
}
